name: Deploy to Cloudflare Pages

# Deploys main on push, PRs as previews. Requires repo secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Project name is hardcoded below.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      # Plain git instead of actions/checkout: JavaScript actions run on the
      # runner's bundled Node, and this pipeline is meant to be Node-free like the
      # site. Full history (no --depth) so Hugo's :git lastmod dates resolve. The
      # token is passed per command and never written to .git/config.
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraheader="$auth" fetch -q --no-tags origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD

      - name: Install toolchain (pinned Hugo + Tailwind binaries)
        run: make setup

      - name: Type-check (tsgo)
        run: make typecheck

      # Python for ML workbooks: the solutions must pass their tests on the
      # pinned stack, and every example shown on a chapter page must still print
      # what the page says, or the deploy stops. Then the packets are zipped into
      # static/downloads/ for Hugo to publish.
      # uv (one static binary, checksum-pinned) instead of actions/setup-python,
      # for the same reason as the checkout above. It installs Python itself.
      # The venv goes first on PATH, so the Makefile's default python3 is it.
      - name: Install Python + the pinned workbook stack (uv)
        env:
          UV_VERSION: "0.13.1"
          UV_SHA256: eadd9d27c134ab5ac1ffd4473b97a741407f3ea238288f03121fc4deddf90220 # x86_64 linux
          REQUIREMENTS: workbooks/python-for-ml/requirements.txt
        run: |
          uv_dir="$RUNNER_TEMP/uv"; venv="$RUNNER_TEMP/workbooks-venv"
          mkdir -p "$uv_dir"
          curl -fsSL -o "$uv_dir/uv.tar.gz" "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "$UV_SHA256  $uv_dir/uv.tar.gz" | sha256sum -c --quiet -
          tar -xzf "$uv_dir/uv.tar.gz" -C "$uv_dir" --strip-components=1
          "$uv_dir/uv" venv -q --python 3.12 "$venv"
          export VIRTUAL_ENV="$venv"
          # torch first, from the CPU index alone, so it can't pull the
          # multi-gigabyte CUDA build. Everything else then comes from PyPI only
          # (torch's +cpu build already satisfies the torch== pin).
          "$uv_dir/uv" pip install -q "$(grep '^torch==' "$REQUIREMENTS")" --index-url https://download.pytorch.org/whl/cpu
          "$uv_dir/uv" pip install -q -r "$REQUIREMENTS"
          echo "$venv/bin" >> "$GITHUB_PATH"

      - name: Test workbook solutions
        run: make workbooks-test

      - name: Check page examples against a fresh run
        run: make examples-check

      - name: Build workbook zips
        run: make workbooks

      - name: Build CSS
        run: ./bin/tailwindcss -i assets/css/main.css -o assets/css/app.css --minify

      - name: Build site
        run: ./bin/hugo --minify --baseURL "https://wrightfunctions.com/"

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=portfolio
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
