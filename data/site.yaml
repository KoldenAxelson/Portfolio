# ---------------------------------------------------------------------------
# Site config
#
# Edit THIS file first. Everything user-facing reads from here.
# Don't hard-code your name, links, or bio anywhere else.
# ---------------------------------------------------------------------------

# Informational canonical URL. The live site's URLs (canonical, JSON-LD @ids,
# feeds, sitemap) all derive from Hugo's `baseURL`, so this documents intent.
url: "https://wrightfunctions.com"

# Site title — used in <title>, OpenGraph, and JSON-LD WebSite name.
title: "Konrad Wright"

# Tagline / meta description. Keep under 160 chars.
description: "Konrad Wright — senior DevOps engineer: secure AWS infrastructure, GitOps CI/CD, Kubernetes. Five years on federal systems. Founder of Widda & GrowGo."

# Owner identity. Used in <Person> JSON-LD and across the site.
author:
  name: "Konrad Wright"
  handle: "@KoldenAxelson"
  role: "Senior DevOps Engineer"
  location: "Paso Robles, CA"
  email: "KonradWright@Protonmail.com"
  # Intentionally blank — phone is not listed publicly. (Templates guard on
  # `with`, so an empty string renders nothing on the CV or anywhere else.)
  phone: ""
  # Short bio for the hero section. One or two sentences.
  bio: "I make specialized tools for people with problems, then I scale that solution to a magnitude of users."
  # Longer bio for the homepage hero, JSON-LD, and llms.txt.
  longBio: |
    Welcome to my little corner of the internet! I'm a **jack of all trades of the tech world** — fifteen-plus years across web, cloud, security, mobile, and product, comfortable anywhere in the stack. Range only matters if you can specialize on command, so here's the proof: I spent five of those years specialized all the way down, hardening and shipping federal systems on AWS as a DevOps engineer. Hand me an ambiguous problem and I'll take it to production; hand me the specialized seat and I'll own it.

    These days I'm steering back toward government DevOps work. Whether you're here to recruit, scope me out, or just see what I'm up to, this site has it all! I'm either working hard or hopelessly addicted to *Sudoku*.
  # CV summary — a concise, professional bio for the /cv Summary section.
  cvBio: >
    Senior DevOps engineer with fifteen-plus years in software — five of them
    building and securing AWS-hosted systems for federal government and
    enterprise clients, largely on AWS GovCloud: GitOps CI/CD on GitLab and
    ArgoCD, Kubernetes on Docker, and security remediation at scale (1,000+ Fortify findings
    resolved), with STIG compliance training. Previously CompTIA Security+
    certified (2023–2026) and prepared to recertify on hire. U.S. citizen; prior
    DoD CAC holder on unclassified systems, eligible for reinvestigation. Open to
    government DevOps roles where security and end-to-end ownership matter.
  # Public résumé downloads (rendered on /cv). Set either to "" to hide.
  resume:
    pdf: "/resume.pdf"
    docx: "/resume.docx"

# Outbound social / professional links. Remove any you don't want shown.
# (Empty strings are skipped by the social-icons partial.)
links:
  github: "https://github.com/KoldenAxelson"
  linkedin: "https://www.linkedin.com/in/konrad-wright-b53860330/"
  twitter: ""
  mastodon: ""
  bluesky: ""

# Top-nav items. Order matters. Each `icon` keys into data/icons.yaml.
# Deliberately small: Projects (the work), About (the person + Now/Uses/Impossible
# List), Contact, CV. Articles & Certs are surfaced via the homepage section links;
# Now/Uses live under /about; the colophon lives in the footer.
nav:
  - { label: "Projects", href: "/projects", icon: "folder" }
  - { label: "About", href: "/about", icon: "user" }
  # "Email" opens the visitor's mail client. `email: true` is resolved to
  # mailto:<author.email> in topnav.html, keeping the address DRY (set above).
  # boost:false so htmx never tries to AJAX-swap the mailto link.
  - { label: "Email", email: true, icon: "envelope", boost: false }
  - { label: "CV", href: "/cv", icon: "cv" }

# Locale for <html lang> and date formatting. BCP-47 tag.
locale: "en-US"

# Default OpenGraph image (served from /static, no domain prefix).
ogImage: "/og-default.png"

# ---------------------------------------------------------------------------
# The "Ask about Konrad" chat — WHERE IT IS OFFERED.
#
# An ALLOW-LIST, and that is the point: off by default, on in five places. It
# used to be the other way round — every page except /cv and /misc/* — which put
# a chat button on the Skyrim toolkit, the campaign rules, every Dagea article and
# every project write-up. Those are pages somebody is USING. The chat answers
# "who is this person and should I talk to them", so it belongs on the pages where
# that is the question being asked.
#
# Paths are matched against a page's RelPermalink, base-path aware, trailing slash
# optional. Adding a path here is the whole job — see
# partials/func/ai-enabled.html, which both baseof.html (the desktop FAB) and
# partials/topnav.html (the mobile button) read.
#
# The endpoint itself is `aiChatURL` in hugo.toml. With that unset nothing renders
# anywhere, whatever this list says.
# ---------------------------------------------------------------------------
ai:
  pages:
    - "/"              # home
    - "/projects/"     # the project directory, not the individual write-ups
    - "/articles/"     # the article directory, ditto
    - "/certificates/"
    - "/about/"
