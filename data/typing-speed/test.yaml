# The typing test on /misc/typing-speed/ (shortcodes/typing-speed/test.html,
# scripts/pages/typing-speed/main.ts reads it from the widget's data-ts-config).
#
# durations : the time chips, in seconds; `default` is picked on load.
# words     : what the test draws from, in a random order. Short, everyday
#             English words, so the test measures fingers, not spelling.
#             Punctuation and numbers are added by the script when toggled.
durations: [15, 30, 60, 120]
default: 30
words:
