# The Q&A under the /misc/black-hole/ renderer ({{< sim/faq "black-hole" >}}). Same shape as data/sun/faq.yaml.
# Units are M = GM/c²; numbers in step with assets/scripts/pages/black-hole/.
title: "Behind the render"
topics:
  - key: "math"
    label: "The math"
    blurb: "The formula behind each effect, and how the page draws it."
    note: "In the sim"
    items:
      - q: "How big is the black shadow?"
        a: "Light that passes closer than about 5.2 M spirals in and never comes back. The shadow is that capture zone seen from far away, about 2.6 times the event horizon's width."
        snippet: "b_c = 3√3 M ≈ 5.20 M   (no spin)"
        note: "With spin, the edge comes from Bardeen's (1973) photon orbits (shaders.ts rhoCrit), flattened on the side turning toward you."
      - q: "Why does the far side of the disk appear above the hole?"
        a: "Light from behind the hole bends up and over it on its way to you. So you see the back of the disk wrapped above, and below, the shadow."
        snippet: "u(φ) = u₁ + (u₂ − u₁) sn²(sφ + c, k),   u = M/r"
        note: "Each pixel's ray follows this exact orbit, traced once per view (shaders.ts trace). Each frame then only re-lights the gas where the ray crossed the disk."
      - q: "Why is one side of the disk brighter?"
        a: "That side is orbiting toward you at a good fraction of light speed. Its light gets Doppler-boosted and bluer, and the gravity well reddens it all a little."
        snippet: "g = 1 / [uᵗ (1 − Ωλ)],   T_seen = g · T"
        note: "Each crossing's shift g is worked out from its orbit and the ray's angular momentum λ. Since I_ν/ν³ is invariant, shading a blackbody at g·T is exact, not a filter."
      - q: "How hot is the disk?"
        a: "Gas loses orbital energy as it spirals in, and radiates it. Bigger holes have cooler disks, because T ∝ M^−¼."
        snippet: "σT⁴ = 3GMṀ · Q(r) / (8π r³)"
        note: "Q(r) is Page & Thorne's (1974) relativistic factor, zero at the inner edge (presets.ts). That gives about 6,400 K for Gargantua and 7.7 million K for the X-ray binary."
      - q: "Where does the disk end?"
        a: "Close in there are no stable circular orbits. Inside the ISCO, gas stops orbiting and plunges, so the disk has a sharp inner rim, and spin pulls it inward."
        snippet: "r_isco = 6 M (a = 0)   →   2.32 M (a = 0.9)"
        note: "The rim comes from Bardeen, Press & Teukolsky's (1972) formula for each preset's spin (presets.ts). It also sets the orbit the Speed picker times."
      - q: "What are the thin rings hugging the shadow?"
        a: "Light that circled the hole once or more before escaping. Each extra half-orbit squeezes the image about 23× thinner, so the rings nest ever closer to the edge."
        snippet: "δₙ = C(r) · e^(−γ (φ₀ + nπ) / π),   γ = π (no spin)"
        note: "Orders 2 and 3 are drawn at their δₙ, with γ lowered by spin as Johnson et al. (2020) find. Each pixel is lit by the share of it that a ring covers."
      - q: "Why do the spiral arms wind up?"
        a: "Inner gas orbits faster than outer gas, so any pattern shears into a tightening spiral, then smears out."
        snippet: "Ω(r) = 1 / (r^3/2 + a)   (in c³/GM)"
        note: "Six arms are born and fade on a 240 M cycle as they wind up (shaders.ts). Each radius's orbital phase is reduced in double precision on the CPU, so the gas never judders."
      - q: "Why does the X-ray binary look hotter than its temperature?"
        a: "Its disk is so hot that electrons, not atoms, scatter the light. That hardens the spectrum into a diluted blackbody about 1.7× hotter."
        snippet: "I = f⁻⁴ B(f·T),   f ≈ (72 keV / kT)^1/9"
        note: "This is Done et al.'s (2012) colour correction. It takes the X-ray binary's 0.66 keV disk to the 1.1 keV observed in real systems; the two cool disks are unchanged."
  - key: "code"
    label: "Coding decisions"
    blurb: "Why it's built the way it is, and what each choice costs."
    note: "Trade-off"
    items:
      - q: "Why trace the light only when the view changes?"
        a: "Where each pixel's ray crosses the disk depends only on the camera, not on time. So the lens is traced once into textures, and each frame just re-lights those crossings."
        snippet: "if (needsTrace) dispatch(trace)   // tilt, zoom, preset, resize"
        note: "Dragging the tilt re-traces every frame, which is the slowest thing the page does. Automatic resolution steps down during a drag."
      - q: "Why not step each ray through curved space?"
        a: "Around a non-spinning hole a light ray's path has an exact formula. One evaluation per sample replaces hundreds of small integration steps per pixel."
        snippet: "u = u₁ + (u₂ − u₁) · sn²(sφ + c, k)"
        note: "Spin is approximated by stretching those paths to fit the spinning hole's real shadow, so there's no frame dragging twisting the lensed sky."
      - q: "How does auto-exposure avoid stalling?"
        a: "A compute pass meters a 96 × 54 grid of the image every 6 frames and nudges the exposure on the GPU. The original read pixels back to the CPU, freezing the GPU each time."
        snippet: "meter[0] = clamp(meter[0] − 0.5 · err, −1.5, 1.5)"
        note: "The WebGL2 fallback has no compute, so it uses only the starting exposure and runs a little brighter."
      - q: "How do you prove a change didn't alter the picture?"
        a: "A test page swaps the browser's clock for an exact 1/60 s per frame, so every run renders identical frames. A pixel diff then shows exactly what a change touched."
        snippet: "requestAnimationFrame = (cb) => raf(() => cb(t += 1000 / 60))"
        note: "It only runs in a headless browser on a software GPU, outside the site's build, so it isn't automatic yet."
      - q: "Why is the fallback its own file?"
        a: "Most visitors have WebGPU and never need it. The WebGL2 version is a separate 32 KB bundle, loaded with its integrity hash only after WebGPU fails."
        snippet: "<script data-bh-fallback=… data-bh-fallback-integrity=…>"
        note: "Its shaders are a hand port of the WebGPU ones, so a physics change has to be made in both."
      - q: "Why does the Cool Sites card have its own copy?"
        a: "The card is a plain script with no bundler, and its camera never moves, so it traces the lens once and only re-renders the gas, a few texture reads a pixel."
        snippet: "// copied from pages/black-hole/shaders.ts; keep in step"
        note: "Two copies of the physics drift apart unless both are edited together."
  - key: "facts"
    label: "Fun facts"
    blurb: "Things about black holes that are stranger than they sound."
    note: "On this page"
    items:
      - q: "How sharp was the first black hole picture?"
        a: "The Event Horizon Telescope linked dishes across the Earth to image M87* in 2019. Its ring is 42 microarcseconds wide, like spotting a doughnut on the Moon."
        note: "The M87-like preset uses its mass and viewing angle."
      - q: "Was Interstellar's black hole real physics?"
        a: "Largely. Kip Thorne and the effects team traced real light paths and published the method. They left out Doppler beaming so the disk looked even, which is why the film's is symmetric."
        note: "The Gargantua-like preset leaves beaming off too."
      - q: "Would Earth fall in if the Sun became a black hole?"
        a: "No. A black hole of the Sun's mass pulls on Earth exactly as the Sun does. Earth would keep its orbit; it would just get very cold and dark."
      - q: "Would you be stretched like spaghetti?"
        a: "Near a small black hole, yes, long before the horizon. A supermassive one's tides are gentle at the horizon, so you'd cross it without feeling anything special."
      - q: "How fast does gas orbit at the edge?"
        a: "Around a 10-solar-mass hole spinning fast, gas at the inner edge laps it in about 1.4 milliseconds. That's over 700 orbits a second."
        note: "The readout shows each preset's orbit time; the Speed picker slows it down."
      - q: "Is a black hole a good power source?"
        a: "The best there is. A thin disk around a fast-spinning hole turns 15.6 % of the infalling mass into light. Fusion in the Sun manages about 0.7 %."
      - q: "Do black holes evaporate?"
        a: "In theory, by Hawking radiation. But a solar-mass hole is about 60 billionths of a degree above absolute zero, far colder than space, so today they all grow instead."
      - q: "How big is the one at the middle of our galaxy?"
        a: "Sagittarius A* is about 4 million times the Sun's mass, 26,000 light-years away. The Event Horizon Telescope imaged it in 2022."
