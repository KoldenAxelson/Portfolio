# Big changes to the site, rendered at the bottom of /now by
# layouts/_default/now.html. Only the newest ones show (the limit lives in
# that template), so keep adding to the top and never trim: older entries
# simply drop off the page.
#
# Only what a visitor would notice: a new page, a new section, a tool that
# works differently. Typo fixes, refactors and drafts behind the PIN don't
# count. Never list a sealed page's contents or hint at its passcode.
#
#   date : YYYY-MM-DD, the day it went live
#   kind : "new" (a page or feature that didn't exist) or "update"
#   text : one line, first person, what changed
#   url  : where to see it (site path)
#   project : optional project slug, for the icon beside the entry. A /projects/
#             url gets its project's icon on its own; anything else shows the
#             site's mark unless this names a project.
