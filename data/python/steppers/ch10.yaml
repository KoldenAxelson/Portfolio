    - "torch.manual_seed(0)"
    - "df = pd.read_csv('data/oom.csv')"
    - "df = df.dropna()"
    - "df['oom'] = (df['oom'] == 'yes').astype(int)"
    - "X = df[['mem_gb', 'batch_size', 'seq_len']].to_numpy(dtype=np.float32)"
    - "y = df['oom'].to_numpy()"
    - "X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=0)"
    - "mean, std = X_train.mean(axis=0), X_train.std(axis=0)"
    - "X_train, X_test = (X_train - mean) / std, (X_test - mean) / std"
    - "baseline = LogisticRegression().fit(X_train, y_train)"
    - "base_acc = baseline.score(X_test, y_test)"
    - "Xt, yt = torch.from_numpy(X_train), torch.from_numpy(y_train)"
    - "model = nn.Sequential(nn.Linear(3, 16), nn.ReLU(), nn.Linear(16, 2))"
    - "loss_fn = nn.CrossEntropyLoss()"
    - "optimizer = torch.optim.AdamW(model.parameters(), lr=0.05)"
    - "loss_fn(model(Xt), yt)"
    - "for epoch in range(300):"
    - "    optimizer.zero_grad()"
    - "    loss = loss_fn(model(Xt), yt)"
    - "    loss.backward()"
    - "    optimizer.step()"
    - "model.eval()"
    - "with torch.no_grad():"
    - "    pred = model(torch.from_numpy(X_test)).argmax(dim=1)"
    - "mlp_acc = (pred.numpy() == y_test).mean().item()"
    - "{'baseline': round(base_acc, 3), 'mlp': round(mlp_acc, 3)}"
