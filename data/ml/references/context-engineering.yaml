- tag: Term
  title: '"I really like the term context engineering over prompt engineering"'
  url: https://x.com/tobi/status/1935533422589399127
  meta: Tobi Lütke · X · June 2025
  note: 'The post that named it: "the art of providing all the context for the task to be plausibly solvable by the LLM."'
- tag: Term
  title: Effective context engineering for AI agents
  url: https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents
  meta: Rajasekaran, Dixon, Ryan, Hadfield · Anthropic · September 29, 2025
  note: Context as "a finite resource with diminishing marginal returns", and the goal of "the smallest possible set of high-signal tokens".
- tag: Evidence
  title: Context windows
  url: https://platform.claude.com/docs/en/build-with-claude/context-windows
  meta: Anthropic docs · as of October 2026
  note: 'Window sizes, and the warning: "As token count grows, accuracy and recall degrade, a phenomenon known as context rot."'
- tag: Evidence
  title: 'Lost in the Middle: How Language Models Use Long Contexts'
  url: https://arxiv.org/abs/2307.03172
  meta: Liu et al. · 2023
  note: Models use information best at the start or end of a long input, and significantly worse when it sits in the middle.
- tag: Evidence
  title: 'Context Rot: How Increasing Input Tokens Impacts LLM Performance'
  url: https://research.trychroma.com/context-rot
  meta: Hong, Troynikov, Huber · Chroma · July 14, 2025
  note: Eighteen models tested on deliberately simple tasks. Performance slides as input grows, and a ~300-token focused prompt beats the ~113,000-token original.
