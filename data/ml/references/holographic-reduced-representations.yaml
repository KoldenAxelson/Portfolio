# References for content/articles/holographic-reduced-representations.md,
# rendered by {{< ml/references >}}. Listed in the order the article reaches
# them. Numbering is automatic. Looked up 2026-10-31; rechecked 2026-11-03.

- tag: Origin
  title: Holographic Reduced Representations
  url: https://doi.org/10.1109/72.377968
  meta: Tony A. Plate · IEEE Transactions on Neural Networks 6(3) · 1995
  note: The full journal account, after a first version at IJCAI 1991. Random vectors, binding by circular convolution, correlation as its approximate inverse, the FFT shortcut, clean-up memories, and capacity roughly linear in vector length.
- tag: Background
  title: "Hyperdimensional Computing: An Introduction to Computing in Distributed Representation with High-Dimensional Random Vectors"
  url: https://cs.uwaterloo.ca/~jhoey/teaching/cogsci600/papers/Kanerva09.pdf
  meta: Pentti Kanerva · Cognitive Computation 1 · 2009
  note: The friendliest tour of the family, including why random high-dimensional vectors make good symbols and the "What is the dollar of Mexico?" example.
- tag: Background
  title: "Broken Holograms: Two for the Price of One! Urban Legend or Scientific Reality?"
  url: https://orbi.uliege.be/bitstream/2268/348457/2/Holograms%20broken.pdf
  meta: Yvon Renotte · University of Liège (ORBi) · 2026
  note: Why a piece of a typical transmission hologram still shows the whole scene, through a narrower field of view, and why some reflection holograms just break into halves.
- tag: Brain model
  title: A Large-Scale Model of the Functioning Brain
  url: https://doi.org/10.1126/science.1225266
  meta: Eliasmith et al. · Science 338 · 2012
  note: Spaun, a 2.5-million-neuron model that recognises, remembers and draws digits, built on semantic pointers.
- tag: Brain model
  title: "Spaun: A Large-Scale Model of the Functioning Brain (poster)"
  url: http://compneuro.uwaterloo.ca/files/spaun.pdf
  meta: Bekolay et al. · University of Waterloo
  note: Shows Spaun's list memory written as positions bound to items and added together.
- tag: Background
  title: "A Survey on Hyperdimensional Computing aka Vector Symbolic Architectures, Part I: Models and Data Transformations"
  url: https://arxiv.org/abs/2111.06077
  meta: Kleyko, Rachkovskij, Osipov and Rahimi · ACM Computing Surveys 55(6) · 2022
  note: The family HRRs belong to, and how its members differ; it notes that HRRs are sometimes called the Semantic Pointer Architecture, the name Spaun is built on.
- tag: Deep learning
  title: Learning with Holographic Reduced Representations
  url: https://proceedings.neurips.cc/paper/2021/hash/d71dd235287466052f1630f31bde7932-Abstract.html
  meta: Ganesan et al. · NeurIPS 2021
  note: Why HRRs broke inside networks that learn (numerical instability), and the projection step that fixed it, improving retrieval more than 100-fold.
- tag: Attention
  title: Recasting Self-Attention with Holographic Reduced Representations
  url: https://arxiv.org/abs/2305.19534
  meta: Alam, Raff, Biderman, Oates and Holt · ICML 2023
  note: The Hrrformer. Attention rebuilt from binding and superposition, for malware files over 100,000 bytes long; up to 280 times faster to train on Long Range Arena, often with a single layer.
- tag: Today
  title: Nuggets
  url: https://github.com/NeoVertex1/nuggets
  meta: GitHub · checked November 2026
  note: A personal AI assistant, and an MCP memory plugin for coding agents, that keeps facts in complex-valued HRR vectors and recalls them by unbinding and cosine similarity. Open source, not peer-reviewed.
- tag: Today
  title: holomem
  url: https://github.com/polmanas1998-star/holomem
  meta: GitHub · checked November 2026
  note: A fixed-size holographic memory (the Fourier variant of HRR) for dated facts, built as the memory layer of an AI assistant, with a reproducible capacity benchmark. Open source, not peer-reviewed.
