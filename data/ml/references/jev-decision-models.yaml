- tag: Pattern
  title: 'FrugalGPT: How to Use Large Language Models While Reducing Cost and Improving Performance'
  url: https://arxiv.org/abs/2305.05176
  meta: Chen, Zaharia & Zou · 2023
  note: Chaining cheap and expensive models matched the best single model at up to 98% less cost. An early LLM example of the cheap-decider pattern.
# Added with the October 15, 2026 addendum.
- tag: Calibration
  title: Evaluating and Benchmarking the System One Model Jev
  url: https://arxiv.org/abs/2609.37647
  meta: Deußer, Sparrenberg & Sifa · arXiv · September 29, 2026
  note: 'A large independent test: jev-1.13 on 37 datasets, 346,009 requests for $9.15. List-question odds well calibrated (pooled ECE 0.028); yes/no odds rank well but need tuned thresholds (UNFAIR-ToS micro-F1 0.50 to 0.75).'
