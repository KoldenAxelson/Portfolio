- tag: Research
  title: 'Gen-Z: Generative Zero-Shot Text Classification with Contextualized Label Descriptions'
  url: https://arxiv.org/abs/2311.07115
  meta: Kumar, Park & Tsvetkov · ICLR 2024
  note: Classifying with natural-language descriptions of each label, plus a little context, beat both zero-shot and few-shot baselines across six open model families and made results less sensitive to prompt wording.
