- tag: Practice
  title: Announcing Confidential Computing General Access on NVIDIA H100 Tensor Core GPUs
  url: https://developer.nvidia.com/blog/announcing-confidential-computing-general-access-on-nvidia-h100-tensor-core-gpus/
  meta: NVIDIA Technical Blog · April 2024
  note: The H100 was the first GPU to support confidential computing, protecting data and models while they're in use.
- tag: Practice
  title: Creating the First Confidential GPUs
  url: https://cacm.acm.org/practice/creating-the-first-confidential-gpus/
