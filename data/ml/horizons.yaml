# METR's task-completion time horizons, for the {{< ml/horizon >}} demo.
# Generated from METR's own results file for Time Horizon 1.1
# (https://metr.org/assets/benchmark_results_1_1.yaml, unchanged July to
# September 2026, after METR's March 3, 2026 correction). Every model METR
# measured from 2023 on. Minutes of skilled-human task time; ranges are 95%
# confidence intervals. `frontier` is METR's is_sota flag: the model beat every
# model released before it. Do not edit numbers by hand; regenerate from the file.
#
# The demo fits its trend the way METR does: log2(p50) against release date,
# over frontier models released from 2023 on, leaving out estimates above 16
# hours. On this data that gives METR's own 128.7-day doubling time.
source: https://metr.org/time-horizons/
fit_from: 2023-01-01
fit_max_minutes: 960
reference: Claude Opus 4.6
models:
  - { name: "GPT-4", released: 2023-03-14, frontier: true, p50: 3.99, p50_ci: [1.93, 8.0], p80: 0.89, p80_ci: [0.34, 2.52] }
  - { name: "GPT-4 (1106)", released: 2023-11-06, frontier: true, p50: 4.04, p50_ci: [1.87, 8.44], p80: 0.78, p80_ci: [0.28, 2.36] }
