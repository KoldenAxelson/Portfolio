# Simulated odds for the {{< ml/cutoff >}} demo, shaped like the yes/no findings in
# Deußer, Sparrenberg & Sifa (2026): one question at a time, Jev leans toward no;
# many labels at once, it over-says yes. Either way the ranking is good and
# the 50% cutoff is the main problem. Exaggerated so the shift is visible; the paper's
# tuning gains were large only in the many-at-once case. `positives` are the
# truly-yes cases, `negatives` the truly-no ones. `shown` is what the
# reader sees; `tuning` is the held-out labelled sample the Tune button picks a
# cutoff from. Generated once from fixed seeds.
scenarios:
