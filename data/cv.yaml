# Education is deliberately minimal: no degree, and no pretending otherwise.
# Federal DevOps hiring runs on experience + certs + eligibility, so the CV
# leads with those; the diploma line is here because contracts often list it
# as the literal minimum requirement. Empty school/year fields render nothing
# (layouts/_default/cv.html guards them).
education:
  - school: "Cuesta College"
    degree: "General College Coursework"
    year: ""
    notes: "San Luis Obispo, CA"
  - school: ""
    degree: "High School Diploma"
    year: ""
    notes: ""

