    stack: ["Cloudflare Pages", "TypeScript", "Laravel", "Astro", "Discord API"]
    thoughts:
      - "Going independent meant being CEO, engineer, and shipping clerk on the same Tuesday."
      - "A VC pitch that failed taught me more than a funded one would have."
      - "Turns out the government years had quietly been training me to run solo."

  - role: "DevOps Engineer"
    employer: "UNCOMN LLC"
    location: "Remote"
    start: "2020"
    end: "2024"
    startDate: "2020-01-01"
    endDate: "2024-11-01"
    summary: "Five years building and securing AWS-hosted systems — largely on AWS GovCloud — for federal government and enterprise clients. Owned Fortify/SAST security remediation and CI/CD across successive production contracts. Left when the contract concluded — UNCOMN had no other remote seats open, and relocating to the St. Louis office wasn't in the cards."
    highlights:
      - "Resolved 1,000+ Fortify-flagged (SAST) security vulnerabilities, owning security remediation across five years of federal contracts — on CPA, ran bi-weekly Fortify scans and briefed findings through a legacy-modernization effort."
      - "Built GitOps CI/CD on GitLab + ArgoCD on AWS GovCloud, retiring the prior Jenkins-only pipeline — recovered roughly one developer-day per two-week sprint and cut pipeline-environment issues in half."
      - "Scripted and deployed the AWS Lambda + API Gateway layer behind 50+ automated jobs — the team pattern for Java/JavaScript services on Docker/Kubernetes, supporting systems used across US military bases, including every US installation in South Korea."
      - "Ramped from junior hire to owning contract security work within six months, closing sprint work at roughly 6x peer rate (by Jira task points) on ICODES — a 30–40-developer ship and aircraft load-planning platform."
      - "Performed code and security reviews, coordinated agile delivery with external client stakeholders, and completed STIG (Security Technical Implementation Guide) compliance training."
    stack: ["AWS GovCloud", "Kubernetes", "Docker", "GitLab", "ArgoCD", "Fortify", "Java", "Python"]
    thoughts:
      - "Five years of locked-down government infra is where I learned to do it right the first time."
      - "Retiring a Jenkins-only pipeline for GitOps was the most satisfying delete of my career."
      - "Running security review on several production systems at once teaches ruthless triage."

