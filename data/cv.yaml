# ---------------------------------------------------------------------------
# CV data — single source of truth for work history, education, skills.
# Consumed by /cv, the homepage Experience section, and the
# Person.hasOccupation JSON-LD.
#
# Edit THIS file. Don't duplicate the data into templates.
# `skills` is a list (not a map) so category order is preserved.
#
# POSITIONING (2026 rework): aimed at government DevOps work. Titles are the
# official ones only — no unofficial "Lead" anywhere; leadership shows up as
# owned work in the bullets, not in role names. Wording mirrors what federal
# DevOps postings actually ask for (GitOps CI/CD, Kubernetes, SAST/Fortify,
# STIG), and claims nothing that isn't true: STIG is listed as training,
# AWS is plain AWS (not GovCloud), and the lapsed Security+ lives in
# data/certificates/ with an honest cvNote, not here.
# ---------------------------------------------------------------------------

experience:
  - role: "Founder & Independent Software Engineer"
    employer: "Self-directed"
    location: "Paso Robles, CA"
    start: "2025"
    end: "present"
    startDate: "2025-02-01"
    summary: "Independent engineering across owned products, contract work, and self-funded experiments."
    highlights:
      - "Built bighammergarage.com from scratch for a YouTube studio's merch store — every tool the client needs and none they don't, roughly two dozen shirt-and-hat sales to date, hosted for $12/year with no Shopify subscription to manage."
      - "Shipped GrowGo's working prototype — a farmers-market marketplace on Flutter and Cloudflare Workers + D1 — after pitching it for VC funding in 2025."
      - "Took Widda (widda.club), a monetization tool for YouTubers, through Chrome Web Store submission with a small launch team."
