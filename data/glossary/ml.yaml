# Machine learning glossary — the drill-down behind the {{< term >}} windows on
# ML articles (and any future ML deep-dive section). One file per subject, so a
# term is defined once for the whole site.
#
# Same contract as data/glossary/basic-logic.yaml — see that file's header for
# the full syntax. In short:
#
#   key            lowercase-hyphen, what {{< term "key" >}} passes
#   term           the label in the window header
#   definition     one plain sentence
#   notes          optional paragraphs: why it matters, a real example
#   aliases        other names the term really goes by ("8-bit" for INT8) or word
#                  forms ("quantized"). Read only by scripts/writing/check-terms.py, which
#                  flags linked text that is none of these. Never a paraphrase.
#   [[key|text]]   a cross-reference (always the two-part form)
#   **bold**       emphasis
#
# Figures (assets/scripts/site/definitions/def-figures.ts). The ML kind so far:
#
#   kind: levels      a ruler with one mark per value the format can hold; a
#                     true value wanders and gets stored at the nearest mark.
#                     `levels` is how many values (16 for 4-bit, 3 for ternary),
#                     `mode: float` crowds the marks toward zero the way
#                     floating point does, `label` overrides the caption, and
#                     `cycle: ["256", "16", "3"]` steps through several widths.
#                     Shared by every precision term, so they read as one family.

# ── Models ───────────────────────────────────────────────────────────

model:
  term: Model
  definition: >-
    A function whose inner numbers are learned from examples instead of written
    by hand: input in, guess out.

training:
  term: Training
  definition: >-
    Feeding a [[model|model]] examples and nudging its [[weights|weights]] until
    its guesses clear the bar you set.

weights:
  term: Weights
  definition: >-
    The learned numbers inside a [[model|model]]. [[training|Training]] sets
    them; once the model ships, they stay frozen.

gradient-descent:
  term: Gradient Descent
  definition: >-
    Nudging every [[weights|weight]] a little in the direction that makes the
    model's error smaller, over and over.

loss:
  term: Loss
  aliases: ['loss function']
  definition: >-
    A single number for how wrong a model's guesses are on some examples.
    [[training|Training]] tries to make it small.

learning-rate:
  term: Learning Rate
  definition: >-
    How big a step [[gradient-descent|gradient descent]] takes each time. Too
    big and it overshoots; too small and it takes forever.

epoch:
  term: Epoch
  aliases: ['epochs']
  definition: >-
    One full pass through the training data.

stochastic-gradient-descent:
  term: Stochastic Gradient Descent (SGD)
  definition: >-
    [[gradient-descent|Gradient descent]] that steps on a small random batch of
    examples at a time instead of all of them.
  notes:
    - >-
      Strictly, the name means one example per step, but in practice it covers
      small batches too.

backpropagation:
  term: Backpropagation
  aliases: ['backprop']
  definition: >-
    The bookkeeping that works out, for every [[weights|weight]] at once, which
    way to nudge it to lower the [[loss|loss]].

overfitting:
  term: Overfitting
  aliases: ['overfit', 'overfits']
  definition: >-
    Fitting the training examples so closely, noise and all, that the model
    does worse on new data. Memorizing the practice test.

generalization:
  term: Generalization
  aliases: ['generalize', 'generalizes']
  definition: >-
    How well a model does on data it has never seen, the performance that
    counts once it ships.

linear-regression:
  term: Linear Regression
  definition: >-
    The simplest [[model|model]]: draw the best straight line through your data
    points, then read new points off the line.

neural-network:
  term: Neural Network
  definition: >-
    A [[model|model]] made of layers of simple units, each passing weighted
    signals on to the next.
  notes:
    - >-
      The digit reader in *What Is ML Infrastructure?* is a tiny one, about
      nineteen thousand [[weights|weights]]. A chatbot's is millions of times
      bigger, but the same shape.

llm:
  term: Large Language Model (LLM)
  definition: >-
    A very large [[neural-network|neural network]] trained on text to predict the
    next [[token|token]].

training-cutoff:
  term: Training Cutoff
  definition: >-
    The date a model's training data ends. It knows nothing that happened after.

classification:
  term: Classification
  aliases: ['classify', 'classifier']
  definition: >-
    Sorting an input into one of a fixed set of categories, like "spam" or "not
    spam".

decision-model:
  term: Decision Model
  aliases: ['System One model']
  definition: >-
    A [[model|model]] that returns odds over answers you define, instead of
    writing text.
  notes:
    - >-
      TypeSafe AI calls its version, Jev, a "System One model". The name echoes
      psychologist Daniel Kahneman's fast, intuitive System 1, as opposed to the
      slow, deliberate System 2.
    - >-
      It's [[classification|classification]] with a twist: you write the
      categories fresh for every question, in plain language, with no
      [[training|training]] of your own.

# ── The loop ─────────────────────────────────────────────────────────

mlops:
  term: MLOps
  definition: >-
    The practice of automating a model's whole life: ingest data, retrain,
    evaluate, ship, and watch it, on repeat.
  notes:
    - >-
      What makes it its own discipline is [[continuous-training|continuous
      training]]: normal software stays correct until someone changes it; a
      model doesn't.

test-set:
  term: Test Set
  aliases: ['held-out set', 'held-out data']
  definition: >-
    Examples kept out of [[training|training]] entirely, used only to measure
    how well the finished model does on data it has never seen.

validation-set:
  term: Validation Set
  definition: >-
    Examples held out from [[training|training]] and used to choose settings
    along the way, so the [[test-set|test set]] stays untouched.

data-leakage:
  term: Data Leakage
  aliases: ['contamination', 'leakage', 'leaked']
  definition: >-
    When test examples, or close copies, sneak into the training data, so the
    model's score measures memory instead of skill.

benchmark:
  term: Benchmark
  aliases: ['benchmarks']
  definition: >-
    A fixed test, run the same way every time, so results can be compared:
    for models, usually a public [[test-set|test set]]; for software, a
    workload that gets timed or measured.

f1-score:
  term: F1 Score
  aliases: ['F1']
  definition: >-
    One number from 0 to 1 that rewards a yes/no classifier for catching the
    real cases and penalizes it for false alarms.
  notes:
    - >-
      It averages two rates, how many flagged cases were real and how many real
      cases got flagged, so a model can't score well by flagging everything
      when real cases are rare.

llm-as-judge:
  term: LLM-as-Judge
  aliases: ['LLM judge', 'judge model']
  definition: >-
    Using one language model to grade another's answers, as a cheap stand-in
    for human reviewers.

regression-suite:
  term: Regression Suite
  aliases: ['regression suites', 'regression tests']
  definition: >-
    A set of tests that every new version must pass, including every past bug,
    so fixed problems stay fixed.

continuous-training:
  term: Continuous Training
  definition: >-
    Retraining a model automatically on fresh data, because the world keeps
    moving and a frozen model falls behind.

eval-gate:
  term: Eval Gate
  definition: >-
    An automatic check that blocks a new model from shipping unless it beats the
    one already running.
  notes:
    - >-
      A worse model is worse than no change at all, so the gate defaults to "no".

# ── Data ─────────────────────────────────────────────────────────────

data-layer:
  term: Data Layer
  definition: >-
    Everything that gathers, cleans, [[label|labels]], stores and versions the
    data a model learns from.
  notes:
    - On most real teams, it's where most of the work goes.

label:
  term: Label
  definition: >-
    The right answer attached to a training example: "this image is a 7".
  notes:
    - >-
      A model learns its labels faithfully, mistakes included. Garbage in,
      garbage out.

feature:
  term: Feature
  definition: >-
    An input value computed from raw data for the model to use, like a
    customer's average order size.

feature-store:
  term: Feature Store
  definition: >-
    A shared system that computes each [[feature|feature]] the same way in
    [[training|training]] and in live [[inference|serving]].
  notes:
    - >-
      Its main job is to kill [[train-serve-skew|train/serve skew]].

train-serve-skew:
  term: Train/Serve Skew
  definition: >-
    When a [[feature|feature]] is computed one way in training and another way in
    production, so the model sees a subtly different world live.

data-versioning:
  term: Data Versioning
  definition: >-
    Keeping snapshots of training data, the way git keeps code, so you can say
    exactly what a model learned from.
  notes:
    - You need it to reproduce, audit, or roll back a model.

# ── Production ───────────────────────────────────────────────────────

drift:
  term: Drift
  definition: >-
    A model slowly getting worse because the world changes while its
    [[weights|weights]] stay frozen.
  notes:
    - >-
      It's quiet: the service stays up and the logs stay clean. Only the answers
      get worse. [[monitoring|Monitoring]] is how you catch it.

monitoring:
  term: Monitoring
  definition: >-
    Watching a model's predictions in production and raising an alarm when they
    stop looking like they used to.
  notes:
    - >-
      Unlike a CPU dashboard, it watches the outputs themselves. The alarm is
      what kicks off [[continuous-training|retraining]].

inference:
  term: Inference (Serving)
  definition: >-
    Running a trained model to answer real requests, as opposed to
    [[training|training]] it.

autoscaling:
  term: Autoscaling
  definition: >-
    Adding or removing servers automatically as traffic rises and falls, so
    [[latency|response times]] stay flat.

latency:
  term: Latency
  definition: How long one request takes to get its answer.

throughput:
  term: Throughput
  definition: How many requests a system can answer per second.

# ── Cost ─────────────────────────────────────────────────────────────

quantization:
  term: Quantization
  aliases: ['quantized']
  definition: >-
    Storing a model's [[weights|weights]] at lower precision, like 8-bit instead
    of 16-bit, so it needs less memory and costs less to run.
  notes:
    - >-
      Done well, the answers barely change. LLM.int8() ran a 175-billion-weight
      model in 8-bit with no measurable loss in accuracy.
    - >-
      How low you can go, and how, is its own history: see
      [[precision|precision]], [[post-training-quantization|post-training
      quantization]] and [[1-bit-llm|1-bit LLMs]].
  figure: { kind: levels, levels: 16 }

batching:
  term: Batching
  definition: >-
    Answering many requests in one pass through the model, so they share the
    work.
  notes:
    - It trades a little [[latency|latency]] for a lot of [[throughput|throughput]].

model-routing:
  term: Model Routing
  aliases: ['routing', 'router', 'routed']
  definition: >-
    Sending each request to whichever model should answer it, usually the
    cheapest one that's good enough.

cascade:
  term: Cascade
  aliases: ['cascades']
  definition: >-
    Trying a cheap model first and escalating to a bigger one only when the
    first answer looks unreliable.

confidence-threshold:
  term: Confidence Threshold
  definition: >-
    The level of certainty below which a system stops trusting a model's answer
    and escalates, asks a human, or falls back.
  notes:
    - >-
      It's only as good as the model's [[calibration|calibration]]: an
      overconfident model sails past any threshold.

distillation:
  term: Distillation
  aliases: ['distilled', 'distill']
  definition: >-
    [[training|Training]] a small model to copy a big model's answers, so it
    gets much of the skill at a fraction of the cost.

semantic-cache:
  term: Semantic Cache
  aliases: ['semantic caching']
  definition: >-
    A cache that returns a stored answer when a new question means the same
    thing as an old one, even if it's worded differently.
  notes:
    - >-
      It matches questions by their [[embedding|embeddings]], so "how do I
      reset my password" can hit the cached answer to "forgot my password".

prompt-caching:
  term: Prompt Caching
  definition: >-
    A provider feature that remembers the start of a prompt you send often, and
    charges much less when you send it again.

self-hosting:
  term: Self-Hosting
  aliases: ['self-host', 'self-hosted']
  definition: >-
    Running a model on machines you control, rented or owned, instead of
    calling someone else's API.

gpu-utilization:
  term: GPU Utilization
  aliases: ['utilization']
  definition: >-
    The share of time a [[gpu|GPU]] you're paying for is actually doing useful
    work.
  notes:
    - An idle GPU still bills by the hour.

break-even:
  term: Break-Even Point
  aliases: ['break-even', 'break even']
  definition: >-
    The usage level where two options cost the same.
  notes:
    - Below it one is cheaper; above it, the other.

rate-limit:
  term: Rate Limit
  aliases: ['rate limits', 'rate-limited']
  definition: >-
    A provider's cap on how many requests or [[token|tokens]] you can send per
    minute.
  notes:
    - Usually raised as your account's usage grows.

zero-data-retention:
  term: Zero Data Retention
  definition: >-
    An API arrangement where the provider doesn't store your prompts or outputs
    after answering, usually granted case by case.

# ── Precision ────────────────────────────────────────────────────────

precision:
  term: Precision
  definition: >-
    How many bits a computer spends storing one number, which sets how finely
    that number can be written down.
  notes:
    - >-
      Each bit doubles the number of values on offer: 16 bits can hold 65,536
      different values, 4 bits only 16. Fewer values means more rounding, but
      also less memory for every one of a model's [[weights|weights]].
  figure: { kind: levels, cycle: ["256", "16", "3"] }

fp16:
  term: FP16 (16-bit floating point)
  definition: >-
    A 16-bit way of storing a number with a movable decimal point, and the
    usual format large models are stored and run in.
  notes:
    - >-
      Floating point spends some bits on the digits and some on where the point
      sits, so it covers tiny and huge numbers alike. Its close cousin BF16 is
      the everyday format for [[training|training]].
  figure: { kind: levels, levels: 65536, mode: float, label: "16 bits · 65,536 values" }

fp8:
  term: FP8 (8-bit floating point)
  definition: >-
    An 8-bit floating-point format, built into data-center GPUs since NVIDIA's
    H100, and precise enough to [[training|train]] with.
  notes:
    - >-
      Half the memory of [[fp16|FP16]]. DeepSeek-V3 was trained largely in FP8,
      one of the first frontier-scale models to do it.
  figure: { kind: levels, levels: 256, mode: float }

int8:
  term: INT8
  aliases: ['8-bit', '8 bits']
  definition: >-
    Storing each number as a whole number from −128 to 127, one byte apiece,
    plus a shared multiplier to turn it back into the real value.
  notes:
    - >-
      That multiplier is the whole trick. Each small block of
      [[weights|weights]] gets its own, so 127 can mean 0.8 in one block and 12
      in the next.
  figure: { kind: levels, levels: 256 }

int4:
  term: INT4
  aliases: ['4-bit', '4 bits']
  definition: >-
    Storing each number as a whole number from −8 to 7: half a byte apiece,
    with a shared multiplier per block.
  notes:
    - >-
      A quarter of [[fp16|FP16]]'s memory, and the workhorse for running
      [[llm|LLMs]] on ordinary hardware.
  figure: { kind: levels, levels: 16 }

fp4:
  term: FP4 (4-bit floating point)
  definition: >-
    A 4-bit floating-point format with only 16 values, packed closer together
    near zero, built into NVIDIA GPUs from the Blackwell generation on.
  notes:
    - >-
      Sixteen values is crude on its own, so FP4 always travels in small blocks
      that share a scale. MXFP4 (an industry standard) and NVFP4 (NVIDIA's) are
      the two you'll see on model cards.
  figure: { kind: levels, levels: 16, mode: float }

outlier:
  term: Outlier
  definition: >-
    A value far larger than the ones around it. In big language models, a few
    of them carry an outsized share of the answer.
  notes:
    - >-
      One huge value stretches the scale for its whole block, so the small
      numbers beside it all round to zero. LLM.int8() fixed this by leaving the
      outliers in 16-bit and rounding everything else.

pruning:
  term: Pruning
  definition: >-
    Deleting the [[weights|weights]] that matter least, so they never need
    storing or computing.

post-training-quantization:
  term: Post-Training Quantization (PTQ)
  definition: >-
    Rounding an already-trained model down to fewer bits, using a little sample
    data to decide how, with no retraining.
  notes:
    - >-
      Cheap: hours on one GPU, not months on thousands. GPTQ and AWQ are the
      famous ones. The expensive alternative is
      [[quantization-aware-training|quantization-aware training]].

quantization-aware-training:
  term: Quantization-Aware Training (QAT)
  definition: >-
    [[training|Training]] a model while it already feels the rounding, so it
    learns [[weights|weights]] that survive being squeezed.
  notes:
    - >-
      It costs a real training run, but it's how the lowest bit counts work:
      [[1-bit-llm|1-bit LLMs]] are trained this way from scratch.

lora:
  term: LoRA (Low-Rank Adaptation)
  definition: >-
    [[fine-tuning|Fine-tuning]] a model by training a small add-on set of
    [[weights|weights]] while the original ones stay frozen.
  notes:
    - >-
      QLoRA keeps the frozen original in 4-bit and trains only the add-on, which
      is how a 65-billion-weight model got fine-tuned on a single GPU.

gguf:
  term: GGUF
  definition: >-
    A single-file format that holds a [[quantization|quantized]] model and
    everything needed to run it, made for llama.cpp.
  notes:
    - >-
      If you've downloaded a model to run on your own machine with a tool like
      Ollama or LM Studio, it was very likely a GGUF file. Names like
      "Q4_K_M" tell you its bit width.

1-bit-llm:
  term: 1-bit LLM
  aliases: ['1-bit model']
  definition: >-
    A language model whose [[weights|weights]] are stored in about one bit each,
    often just −1, 0 or +1, and trained that way from the start.
  notes:
    - >-
      Three values need log₂3 ≈ 1.58 bits, hence the name BitNet b1.58. With
      weights that small, the model's multiplications become additions, which is
      where most of the energy saving comes from.
  figure: { kind: levels, levels: 3 }

# ── Safety ───────────────────────────────────────────────────────────

guardrail:
  term: Guardrail
  definition: >-
    A check on a model's output before a user sees it: is it valid, in range,
    does it match the [[schema|schema]], does a second model agree?

fallback:
  term: Fallback
  aliases: ['fall back']
  definition: >-
    What you serve when a [[guardrail|guardrail]] fails: a simpler model, a cached
    answer, a safe default, or a human.

schema:
  term: Schema
  definition: >-
    The shape an output must have, such as which fields it needs and what type
    each one is.

structured-output:
  term: Structured Output
  definition: >-
    Model output that always fits a fixed [[schema|schema]], such as JSON with
    known fields, so a program can use it without parsing prose.

calibration:
  term: Calibration
  aliases: ['calibrated', 'well-calibrated']
  definition: >-
    How well a model's stated confidence matches how often it's right: a
    calibrated model that says "80%" is right about 80% of the time.
  notes:
    - >-
      Accuracy asks "is it right?". Calibration asks "does it know when it's
      right?". A calibrated model can be wrong often and still be useful,
      because it tells you which answers to double-check.

# ── Security ─────────────────────────────────────────────────────────

prompt-injection:
  term: Prompt Injection
  aliases: ['injected']
  definition: >-
    Text that smuggles instructions into a model's input, so the model follows
    the attacker instead of the person it works for.
  notes:
    - >-
      Named by Simon Willison in September 2022, after SQL injection. The
      difference: a database can keep code and data apart, and a language model
      can't.

sql-injection:
  term: SQL Injection
  definition: >-
    Typing database code into a form field so the app runs it, because the app
    glued user input straight into its query.
  notes:
    - >-
      The fix is to send the query and the user's data separately
      ("parameterized queries"), so input can never become code.

indirect-prompt-injection:
  term: Indirect Prompt Injection
  definition: >-
    [[prompt-injection|Prompt injection]] planted in content the model reads on
    its own, like a web page, an email or a file, rather than typed by the user.

jailbreak:
  term: Jailbreak
  aliases: ['jailbreaking']
  definition: >-
    Talking a model into ignoring its own safety rules.
  notes:
    - >-
      Unlike [[prompt-injection|prompt injection]], it attacks the model
      itself, not an app built on top of it.

system-prompt:
  term: System Prompt
  definition: >-
    The instructions an app gives a model before the user's input arrives: who
    it is, what it may do, what to refuse.

least-privilege:
  term: Least Privilege
  definition: >-
    Giving a user, service or model only the access its job needs, so a mistake
    or a takeover can do only limited damage.

exfiltration:
  term: Exfiltration
  aliases: ['exfiltrate', 'exfiltrated']
  definition: >-
    Getting data out of a system without permission, whether by copying files,
    sending messages or hiding it in a web request.

lethal-trifecta:
  term: Lethal Trifecta
  definition: >-
    An [[agent|agent]] that can read private data, sees untrusted content and
    can send data out.
  notes:
    - With all three, one injected instruction can leak your data.
    - >-
      Simon Willison's name for it (June 2025). Remove any one leg and the
      [[exfiltration|exfiltration]] path closes.

insider-threat:
  term: Insider Threat
  aliases: ['insider', 'insiders']
  definition: >-
    Risk from people who already have legitimate access, such as employees or
    contractors, whether they mean harm or are tricked.

supply-chain-attack:
  term: Supply-Chain Attack
  aliases: ['supply chain']
  definition: >-
    Breaking into a target through something it trusts and installs, like a
    software package, a downloaded model or a vendor's update.

egress:
  term: Egress
  aliases: ['egress controls', 'egress limits']
  definition: >-
    Data leaving a network; egress controls cap or block it so a stolen file
    can't simply stream out.
  notes:
    - >-
      Model [[weights|weights]] are huge, which helps the defender: a
      bandwidth cap that barely slows normal work can make copying hundreds of
      gigabytes take long enough to get noticed.

confidential-computing:
  term: Confidential Computing
  definition: >-
    Hardware that walls data off while it's being processed, and encrypts
    whatever leaves, so the machine's owner or a compromised host can't read it
    from memory.

safetensors:
  term: Safetensors
  definition: >-
    A file format for model [[weights|weights]] that holds only numbers and a
    short header, never code, so loading one can't run hidden code the way
    older Python "pickle" files can.

open-weights:
  term: Open Weights
  aliases: ['open-weight', 'open-weights model']
  definition: >-
    A model whose trained [[weights|weights]] are published for anyone to
    download and run, as with Meta's Llama.

# ── Hardware ─────────────────────────────────────────────────────────

gpu:
  term: GPU
  aliases: ['GPUs', 'graphics processing unit']
  definition: >-
    A chip with thousands of simple cores that all do the same math at once.
    Built for graphics, now the workhorse of AI.

accelerator:
  term: Accelerator
  definition: >-
    Any chip built to run one kind of work faster than a general-purpose CPU.
    For AI: [[gpu|GPUs]], [[tpu|TPUs]] and their rivals.

tpu:
  term: TPU
  aliases: ['tensor processing unit']
  definition: >-
    Google's own AI [[accelerator|accelerator]], mostly rented through Google
    Cloud; a few giant buyers get whole racks.

cuda:
  term: CUDA
  definition: >-
    NVIDIA's platform for writing general-purpose programs that run on its
    [[gpu|GPUs]]. Released in 2007, and a big reason NVIDIA leads in AI.

flops:
  term: FLOPS
  aliases: ['FLOP', 'FLOPs', 'teraFLOPS', 'TFLOPS']
  definition: >-
    Floating-point operations per second: how much arithmetic a chip can do.
    One trillion of them is a teraFLOPS.

hbm:
  term: HBM
  aliases: ['high-bandwidth memory']
  definition: >-
    High-bandwidth memory: stacks of memory chips packed right beside the
    processor, so data has a short, very wide road to travel.

memory-bandwidth:
  term: Memory Bandwidth
  definition: >-
    How many bytes per second a chip can pull from its memory. For many AI
    jobs, it matters more than the chip's [[flops|FLOPS]].

arithmetic-intensity:
  term: Arithmetic Intensity
  definition: >-
    How much math a job does for each byte it reads from memory. Low means
    [[memory-bound|memory-bound]]; high means [[compute-bound|compute-bound]].
  notes:
    - >-
      The roofline model (Williams, Waterman and Patterson, 2009) plots speed
      against it: below a certain intensity, memory sets the pace; above it,
      the math units do.

memory-bound:
  term: Memory-Bound
  definition: >-
    Limited by how fast data arrives from memory, while the math units sit
    idle. Generating text one [[token|token]] at a time usually is.

compute-bound:
  term: Compute-Bound
  definition: >-
    Limited by how fast the chip can do math. The point where adding more work
    finally costs you speed.

nvlink:
  term: NVLink
  definition: >-
    NVIDIA's direct connection between [[gpu|GPUs]], many times faster than
    ordinary networking, so a group of GPUs can work almost like one.

# ── Government ───────────────────────────────────────────────────────

fedramp:
  term: FedRAMP
  definition: >-
    The US government's shared security review for cloud services, so each
    agency doesn't have to vet the same vendor from scratch.
  notes:
    - >-
      Services used to be rated Low, Moderate or High. Rules that took effect
      on July 4, 2026 renamed "authorization" to "certification" and moved Low,
      Moderate and High into Classes B, C and D, with a new pilot Class A.
      Vendors still widely say "FedRAMP High".

authority-to-operate:
  term: Authority to Operate (ATO)
  definition: >-
    An agency official's formal sign-off that a system's remaining risk is
    acceptable, which it needs before it can go live.

cui:
  term: Controlled Unclassified Information (CUI)
  definition: >-
    Government information that isn't classified but still has to be
    protected, like personal records, law enforcement data or contract details.

impact-level:
  term: Impact Level
  aliases: ['IL', 'impact levels']
  definition: >-
    The Defense Department's cloud ratings. IL2 is public and other
    non-sensitive data, IL4 and IL5 are [[cui|CUI]], and IL6 is classified up
    to Secret.

govcloud:
  term: GovCloud
  aliases: ['government region']
  definition: >-
    A cloud provider's regions reserved for government work, physically
    separate and run by screened US staff. Microsoft's version is Azure
    Government.

air-gapped:
  term: Air-Gapped
  aliases: ['air gap']
  definition: >-
    Physically cut off from the internet and other networks, so data can only
    move in or out by hand.

audit-log:
  term: Audit Log
  definition: >-
    A tamper-resistant record of who did what, and when, kept so you can prove
    it later.

# ── Training at scale ───────────────────────────────────────────────

data-parallelism:
  term: Data Parallelism
  aliases: ['data parallel']
  definition: >-
    Giving every [[gpu|GPU]] a full copy of the model and a different slice of
    the training data, then averaging what they learned after every step.

tensor-parallelism:
  term: Tensor Parallelism
  aliases: ['tensor parallel']
  definition: >-
    Splitting each layer of a model across several [[gpu|GPUs]], so they
    compute every layer together.

pipeline-parallelism:
  term: Pipeline Parallelism
  aliases: ['pipeline parallel']
  definition: >-
    Giving each [[gpu|GPU]] a different run of layers and passing data from one
    to the next, like an assembly line.

fsdp:
  term: FSDP
  aliases: ['fully sharded data parallel', 'ZeRO', 'sharded data parallelism']
  definition: >-
    Fully sharded data parallel: [[data-parallelism|data parallelism]] where
    each GPU stores only a slice of the model and borrows the rest as needed.
  notes:
    - >-
      PyTorch's name for it. Microsoft's DeepSpeed calls the same idea ZeRO.

all-reduce:
  term: All-Reduce
  definition: >-
    A group operation where every [[gpu|GPU]] contributes numbers and every GPU
    ends up with the total, used to average gradients in training.

nccl:
  term: NCCL
  definition: >-
    NVIDIA's library for moving data between [[gpu|GPUs]] during training.
    Pronounced "nickel".

checkpoint:
  term: Checkpoint
  aliases: ['checkpointing', 'checkpoints']
  definition: >-
    A saved snapshot of a training run's full state, so it can restart from
    there instead of from scratch.

mfu:
  term: MFU
  aliases: ['model FLOPs utilization']
  definition: >-
    Model FLOPs utilization: the share of the hardware's peak
    [[flops|FLOPS]] that actually went into training the model.
  notes:
    - >-
      Google introduced it with PaLM in 2022, at 46.2%. Meta's Llama 3 run
      reached 38–43% on up to 16,000 GPUs.

# ── Language models ──────────────────────────────────────────────────

token:
  term: Token
  definition: >-
    The chunk of text a language model reads and writes: often a whole word,
    sometimes a piece of one.
  notes:
    - You're billed per token, not per word.
    - >-
      Real tokenizers learn their splits from data, usually with
      [[byte-pair-encoding|byte-pair encoding]].

byte-pair-encoding:
  term: Byte-Pair Encoding
  definition: >-
    A way to learn how to split text into [[token|tokens]] from data, by merging
    the most common pairs of characters over and over.

tokenizer:
  term: Tokenizer
  aliases: ['tokenizers']
  definition: >-
    The program that splits text into [[token|tokens]] and swaps each one for
    its [[token-id|token ID]] before a model sees it.

vocabulary:
  term: Vocabulary
  aliases: ['vocab']
  definition: >-
    The fixed list of every [[token|token]] a model can read or write, one
    entry per row of its [[embedding-table|embedding table]].
  notes:
    - GPT-2's vocabulary has 50,257 tokens.

token-id:
  term: Token ID
  aliases: ['token IDs']
  definition: >-
    A [[token|token]]'s number in the [[vocabulary|vocabulary]], which is also
    its row number in the [[embedding-table|embedding table]].
  notes:
    - >-
      In GPT-2, " cat" (with its leading space) is 3797 and "cat" without the
      space is 9246: two different rows.

embedding-table:
  term: Embedding Table
  aliases: ['embedding tables', 'embedding matrix', 'token embedding table']
  definition: >-
    A table of learned numbers with one row per [[token|token]] in the
    [[vocabulary|vocabulary]]; reading a token means copying its row.
  notes:
    - >-
      Each row is that token's [[embedding|embedding]]. GPT-2's smallest model
      has 50,257 rows of 768 numbers each, about 38.6 million
      [[weights|weights]] in all.

one-hot:
  term: One-Hot Vector
  aliases: ['one-hot', 'one-hot vectors']
  definition: >-
    A list of zeros with a single 1, at the position of the item it stands
    for.
  notes:
    - >-
      Multiplying a one-hot vector by an [[embedding-table|embedding table]]
      gives back exactly one row, which is why a lookup can skip the
      multiplication.

positional-embedding:
  term: Positional Embedding
  aliases: ['positional embeddings', 'position embedding', 'position embeddings']
  definition: >-
    A learned list of numbers for each position in the input, added to each
    [[token|token]]'s row so the model knows where in the text it sits.
  notes:
    - >-
      Without them, a [[transformer|Transformer]] has no other way to use word
      order. GPT-2 keeps a second table with 1,024 rows, one per position.

logits:
  term: Logits
  aliases: ['logit']
  definition: >-
    The raw scores a language model gives every [[token|token]] in its
    [[vocabulary|vocabulary]] for being the next one, before they're turned
    into probabilities.

weight-tying:
  term: Weight Tying
  aliases: ['tied embeddings']
  definition: >-
    Using the same [[embedding-table|embedding table]] at both ends of a model:
    to read tokens in, and to score [[logits|candidates]] for the next one.
  notes:
    - >-
      GPT-2 does it, and so did the original [[transformer|Transformer]]. It
      saves a second table the size of the first.

rag:
  term: Retrieval-Augmented Generation (RAG)
  definition: >-
    Looking up relevant documents when a question arrives and pasting them into
    the prompt, so the model answers from them instead of from memory.
  notes:
    - >-
      The lookup is often done with [[embedding|embeddings]] in a
      [[vector-database|vector database]], frequently alongside keyword search.

embedding:
  term: Embedding
  definition: >-
    A list of numbers that stands for a thing, such as a word, a piece of text
    or a node in a graph, so that related things land close together.
  notes:
    - >-
      A single [[token|token]]'s embedding is its row in the model's
      [[embedding-table|embedding table]]. Search systems usually embed a whole
      passage at once instead.

vector-database:
  term: Vector Database
  definition: >-
    A store built to quickly find the [[embedding|embeddings]] most similar to
    a query.

chunking:
  term: Chunking
  aliases: ['chunk', 'chunks']
  definition: >-
    Cutting documents into pieces small enough to search and paste into a
    prompt, before any [[rag|retrieval]] happens.

cosine-similarity:
  term: Cosine Similarity
  definition: >-
    A score for how closely two lists of numbers, such as two
    [[embedding|embeddings]], point the same way: 1 for the same direction,
    near 0 for unrelated ones.

bm25:
  term: BM25
  definition: >-
    The classic keyword-ranking formula, the default in search engines such as
    Elasticsearch: rare words that appear often in a document push it up the
    list.

hybrid-search:
  term: Hybrid Search
  definition: >-
    Running keyword search and [[embedding|embedding]] search together and
    merging their rankings, so each covers the other's blind spots.

reranking:
  term: Reranking
  aliases: ['reranker', 'rerank']
  definition: >-
    A second, slower, pickier pass that reorders the top search results by
    reading each one next to the question.

fine-tuning:
  term: Fine-Tuning
  aliases: ['fine-tune', 'fine-tuned']
  definition: >-
    Continuing to [[training|train]] a model's [[weights|weights]] on your own
    data.
  notes:
    - >-
      The cost ranges widely. Qi et al. (2023) broke GPT-3.5 Turbo's safety
      guardrails by fine-tuning it on 10 examples, for less than $0.20 through
      OpenAI's API.
    - The cheaper alternative, usually enough, is better [[prompting|prompting]].

prompting:
  term: Prompting
  definition: >-
    Steering a model with the instructions and context you give it, without
    changing its [[weights|weights]].

transformer:
  term: Transformer
  aliases: ['transformers']
  definition: >-
    The [[neural-network|neural network]] design behind nearly every modern
    language model, built around [[attention|attention]].

attention:
  term: Attention
  definition: >-
    The step where each [[token|token]] looks back at every earlier token and
    decides which ones matter for understanding it.

context-window:
  term: Context Window
  definition: >-
    The most [[token|tokens]] a model can take in at once: your conversation,
    documents and its own answer so far.

sampling:
  term: Sampling
  aliases: ['sample', 'sampled']
  definition: >-
    Picking the next [[token|token]] at random according to the model's odds,
    instead of always taking the most likely one.

temperature:
  term: Temperature
  definition: >-
    A setting that sharpens or flattens the model's odds before
    [[sampling|sampling]]: low is predictable, high is adventurous.

prefill:
  term: Prefill
  definition: >-
    The first phase of answering: the model reads the whole prompt in one
    parallel pass and fills the [[kv-cache|KV cache]].
  notes:
    - It's [[compute-bound|compute-bound]], and it's most of the wait before the first word appears.

decode:
  term: Decode
  aliases: ['decoding']
  definition: >-
    The second phase of answering: generating the reply one [[token|token]] at
    a time, each step reading the whole model from memory.
  notes:
    - It's [[memory-bound|memory-bound]], which is why [[batching|batching]] helps so much.

time-to-first-token:
  term: Time to First Token (TTFT)
  definition: >-
    How long a user waits between sending a request and seeing the first word
    of the answer.

speculative-decoding:
  term: Speculative Decoding
  definition: >-
    Letting a small, fast model guess several [[token|tokens]] ahead and having
    the big model check them all in one pass.

kv-cache:
  term: KV Cache
  definition: >-
    A per-conversation scratchpad that saves the model from re-reading the whole
    conversation for every new [[token|token]].
  notes:
    - >-
      Managing it well is half the battle for LLM speed and cost. vLLM pages it
      like OS virtual memory and gets 2–4× the [[throughput|throughput]].

autoregressive:
  term: Autoregressive
  aliases: ['autoregression']
  definition: >-
    Generating output one [[token|token]] at a time, with each new token fed back
    in as input for the next.
  notes:
    - >-
      Every token is another full pass through the model, which is why long
      answers are slow and why output tokens usually cost more than input.

zero-shot:
  term: Zero-Shot
  definition: >-
    Asking a model to do a task with no worked examples, only the instructions.

multimodal:
  term: Multimodal
  definition: >-
    Able to take more than one kind of input, such as text and images, in the
    same request.

# ── Post-training ────────────────────────────────────────────────────

pretraining:
  term: Pretraining
  aliases: ['pretrained', 'pre-training']
  definition: >-
    The first, biggest stage of [[training|training]] a language model:
    predicting the next [[token|token]] across a huge pile of text.

base-model:
  term: Base Model
  aliases: ['base models']
  definition: >-
    A model straight out of [[pretraining|pretraining]]. It continues text
    rather than answering it, and hasn't been taught to be an assistant.

post-training:
  term: Post-Training
  aliases: ['post-trained']
  definition: >-
    Everything done to a [[base-model|base model]] after
    [[pretraining|pretraining]] to turn it into a helpful, safe assistant.

supervised-fine-tuning:
  term: Supervised Fine-Tuning (SFT)
  definition: >-
    [[fine-tuning|Fine-tuning]] on example conversations written or picked by
    people, so the model learns what a good answer looks like.

reward-model:
  term: Reward Model
  aliases: ['reward models']
  definition: >-
    A model trained to score answers the way people would, learned from many
    "this one's better" comparisons.

rlhf:
  term: RLHF
  aliases: ['reinforcement learning from human feedback']
  definition: >-
    Reinforcement learning from human feedback: letting a model practice and
    rewarding answers a [[reward-model|reward model]] scores highly.

dpo:
  term: DPO
  aliases: ['direct preference optimization']
  definition: >-
    Direct preference optimization: learning from "this one's better" pairs
    directly, with no separate [[reward-model|reward model]] or practice loop.

rlvr:
  term: RLVR
  aliases: ['reinforcement learning with verifiable rewards', 'verifiable rewards']
  definition: >-
    Reinforcement learning with verifiable rewards: rewarding answers that a
    program can check, like a correct math result or code that passes its tests.

constitutional-ai:
  term: Constitutional AI
  definition: >-
    Anthropic's method of training a model to critique and improve its own
    answers against a written list of principles, using AI feedback instead of
    human labels for what counts as harmful.

reward-hacking:
  term: Reward Hacking
  definition: >-
    A model finding a way to score well that its designers didn't intend, like
    special-casing the tests instead of fixing the code.

sycophancy:
  term: Sycophancy
  aliases: ['sycophantic']
  definition: >-
    A model telling people what they want to hear instead of what's true.
  notes:
    - >-
      Partly a side effect of [[rlhf|RLHF]]: people tend to rate agreeable
      answers higher, and the model learns that.

# ── Agents ───────────────────────────────────────────────────────────

harness:
  term: Harness
  definition: >-
    The code wrapped around a model that feeds it context, hands it tools, runs
    its actions and catches its mistakes.
  notes:
    - >-
      The model brings the judgment; the harness brings the hands, the memory
      and the [[guardrail|guardrails]]. Claude Code is one.

agent:
  term: Agent
  definition: >-
    A model inside a [[harness|harness]] that loops: reason, act with a tool,
    observe the result, and pick the next step.

# ── Context ──────────────────────────────────────────────────────────

context-engineering:
  term: Context Engineering
  definition: >-
    Deciding what goes into a model's [[context-window|context window]] at each
    step, and what stays out, so it has what the task needs and little else.
  notes:
    - >-
      Popularized in June 2025 as a better name than "prompt engineering": the
      prompt you type is a small part of what an [[agent|agent]] actually reads.

context-rot:
  term: Context Rot
  definition: >-
    A model getting worse at using what's in its [[context-window|context
    window]] as the window fills, long before it's full.
  notes:
    - >-
      A 2023 study found facts in the middle of a long input are recalled worst.
      In July 2025, Chroma tested 18 models and every one got less reliable as
      the input grew.

agents-md:
  term: AGENTS.md
  definition: >-
    A Markdown file at the root of a repository that tells coding
    [[agent|agents]] how the project works: how to build it, test it, and what
    not to touch.
  notes:
    - >-
      "A README for agents." Launched in August 2025 by OpenAI and others, and
      now looked after by the Linux Foundation's Agentic AI Foundation.

agent-skill:
  term: Agent Skill
  aliases: ['skill', 'agent skills']
  definition: >-
    A folder of instructions, scripts and reference files that an
    [[agent|agent]] loads only when a task calls for it.
  notes:
    - >-
      Up front, the agent sees just each skill's name and one-line description,
      about 100 [[token|tokens]]. That's
      [[progressive-disclosure|progressive disclosure]].

progressive-disclosure:
  term: Progressive Disclosure
  definition: >-
    Showing a model a short summary first and loading the details only when it
    asks for them.

tool-search:
  term: Tool Search
  definition: >-
    Letting an [[agent|agent]] look up the tools it needs when it needs them,
    instead of loading every tool's description up front.

compaction:
  term: Compaction
  aliases: ['compact', 'compacted', 'compacts']
  definition: >-
    Summarizing an [[agent|agent's]] history when its [[context-window|context
    window]] is nearly full, then carrying on from the summary.
  notes:
    - >-
      It frees room, but whatever the summary leaves out is gone. Long-running
      agents also write notes to files, which survive it.

# ── Agent protocols ──────────────────────────────────────────────────

mcp:
  term: Model Context Protocol (MCP)
  definition: >-
    An open standard for plugging tools and data into AI apps: wrap a tool once
    as an MCP server, and any app that speaks MCP can use it.
  notes:
    - >-
      Released by Anthropic in November 2024 and donated to the Linux
      Foundation's Agentic AI Foundation in December 2025.

mcp-server:
  term: MCP Server
  definition: >-
    A program that offers tools, data or prompt templates to AI apps over
    [[mcp|MCP]]. It might run on your laptop as a subprocess or on a remote
    host over HTTPS.
  notes:
    - >-
      Installing one is installing software: MCP's own security policy says a
      local server is "trusted like any other software you install".

tool-poisoning:
  term: Tool Poisoning
  definition: >-
    Hiding instructions for the model inside a tool's description, which the
    model reads but the user usually never sees.
  notes:
    - >-
      A form of [[prompt-injection|prompt injection]], shown against
      [[mcp|MCP]] by Invariant Labs in April 2025. A changed description after
      you've approved the tool is called a rug pull.

a2a:
  term: Agent2Agent Protocol (A2A)
  definition: >-
    An open standard for [[agent|agents]] from different companies to hand each
    other work as peers: send a task, answer questions, get a result, without
    seeing each other's internals.
  notes:
    - >-
      Launched by Google in April 2025, now run under the Linux Foundation.
      Where [[mcp|MCP]] connects an agent to its tools, A2A connects it to other
      agents.

agent-card:
  term: Agent Card
  definition: >-
    A JSON file an [[a2a|A2A]] agent publishes at a well-known web address,
    listing what it can do, where to reach it and how to log in.
  notes:
    - >-
      Like a business card, anyone can print one. Cards can be signed, so a
      client can check who published it before trusting it.

multi-agent-system:
  term: Multi-Agent System
  aliases: ['multi-agent', 'multi-agent systems', 'multi-agent setups']
  definition: >-
    Several [[agent|agents]] splitting one job: usually a lead agent handing
    pieces to others and combining what comes back.

# ── Agent payments ───────────────────────────────────────────────────

mandate:
  term: Mandate
  aliases: ['mandates']
  definition: >-
    A signed record of what you allowed an [[agent|agent]] to buy: either the
    exact cart, or rules like a price cap, a list of shops and an expiry date.
  notes:
    - >-
      The core idea of Google's [[ap2|AP2]]. The shop and the bank check the
      signature and the rules, not the agent's account of what you wanted.

ap2:
  term: Agent Payments Protocol (AP2)
  definition: >-
    Google's open protocol for proving what a user authorized an
    [[agent|agent]] to buy, using signed [[mandate|mandates]].
  notes:
    - >-
      Announced in September 2025 with more than 60 partners, from card
      networks to banks to shops. Version 0.2 went to the FIDO Alliance in 2026.

payment-token:
  term: Payment Token
  definition: >-
    A stand-in for a card number that only works within set limits, such as
    one shop, one amount, one use and a deadline.
  notes:
    - >-
      If an [[agent|agent]] leaks it or gets tricked into spending it, the
      damage is capped by those limits, not by the agent's judgment.

x402:
  term: x402
  definition: >-
    A protocol that uses the web's long-unused "402 Payment Required" status
    code so a program can pay per request, then retry and get the data.
  notes:
    - >-
      Launched by Coinbase in 2025 and usually settled in stablecoins. Built
      for machines paying machines: an [[agent|agent]] buying one API call.

web-bot-auth:
  term: Web Bot Auth
  definition: >-
    A proposed standard where bots and [[agent|agents]] sign their web
    requests, so a site can check who sent them instead of guessing.
  notes:
    - >-
      Built on HTTP Message Signatures (RFC 9421) and now an IETF draft. Visa
      and Cloudflare use it to tell shopping agents from scrapers.

# ── Measuring agents ─────────────────────────────────────────────────

time-horizon:
  term: Time Horizon
  aliases: ['time horizons']
  definition: >-
    The length of task, measured by how long it takes a skilled person, that an
    AI [[agent|agent]] finishes successfully half the time.
  notes:
    - >-
      METR's measure, introduced in March 2025. It's about how hard a task is,
      not how long the agent runs: agents are usually faster than people at the
      tasks they do finish.

# ── Optimization, memory and emergence ───────────────────────────────

optimizer:
  term: Optimizer
  aliases: ['optimizers']
  definition: >-
    The rule that turns a [[loss|loss]]'s slope into an actual change to the
    [[weights|weights]] at each step of [[training|training]].
  notes:
    - >-
      Plain [[stochastic-gradient-descent|SGD]] is the simplest optimizer;
      [[momentum|momentum]] and [[adam|Adam]] add memory of earlier steps.

momentum:
  term: Momentum
  definition: >-
    An [[optimizer|optimizer]] trick that keeps a running average of recent
    steps, so training keeps rolling in a consistent direction instead of
    jittering.

adam:
  term: Adam
  aliases: ['AdamW', 'Adams']
  definition: >-
    The most widely used [[optimizer|optimizer]]: it keeps a fast average of the
    gradient and a slow average of its square, and steps by their ratio.
  notes:
    - >-
      Introduced by Kingma and Ba in 2014 with default decay rates of 0.9 and
      0.999. AdamW is a common variant that handles weight decay separately.

exponential-moving-average:
  term: Exponential Moving Average
  aliases: ['moving average', 'moving averages']
  definition: >-
    A running average where each new value counts a fixed fraction and older
    values fade away gradually.
  notes:
    - >-
      The fraction sets the memory's speed: a decay of 0.9 forgets in about ten
      steps, 0.999 in about a thousand.

loss-landscape:
  term: Loss Landscape
  definition: >-
    The [[loss|loss]] pictured as terrain over every possible setting of the
    [[weights|weights]], with training trying to walk downhill.

local-minimum:
  term: Local Minimum
  aliases: ['local minima']
  definition: >-
    A valley in the [[loss-landscape|loss landscape]] that's lower than its
    surroundings but not the lowest point overall.

emergence:
  term: Emergence
  aliases: ['emergent', 'emergent behavior']
  definition: >-
    Complex group behavior that arises from simple rules followed by many
    individuals, with no one in charge of the pattern.
  notes:
    - >-
      Flocking birds, ant trails and slime-mould networks are the classic
      examples; none of the individuals knows the shape of the whole.

stigmergy:
  term: Stigmergy
  definition: >-
    Coordination through marks left in a shared environment, like ants laying
    pheromone, instead of through direct messages.
  notes:
    - >-
      The memory lives in the environment rather than in any individual, and it
      fades unless it's renewed.

particle-swarm-optimization:
  term: Particle Swarm Optimization
  aliases: ['PSO']
  definition: >-
    A search method where a flock of candidate solutions moves through the
    problem, each pulled toward the best spots it and the others have found.
  notes:
    - >-
      Introduced by Kennedy and Eberhart in 1995, inspired by bird flocking.

population-based-training:
  term: Population-Based Training
  definition: >-
    Training many copies of a [[model|model]] at once and periodically letting
    the weaker ones copy the stronger ones' [[weights|weights]] and settings.

continual-learning:
  term: Continual Learning
  definition: >-
    Training a [[model|model]] on a stream of new tasks or data over time
    without starting over, and without losing what it already knew.

catastrophic-forgetting:
  term: Catastrophic Forgetting
  definition: >-
    When training a [[model|model]] on something new wipes out what it had
    learned before.

biofilm:
  term: Biofilm
  aliases: ['biofilms']
  definition: >-
    A dense, protective mat that bacteria build when they settle down on a
    surface instead of moving.

gene-regulatory-network:
  term: Gene Regulatory Network
  definition: >-
    The web of genes switching each other on and off inside a cell, which
    decides what the cell is doing at any moment.

ribosome:
  term: Ribosome
  aliases: ['ribosomes']
  definition: >-
    The machine inside every cell that builds proteins; how many a cell keeps
    ready controls how fast it can grow.

# ── Vector symbolic ──────────────────────────────────────────────────

holographic-reduced-representation:
  term: Holographic Reduced Representation
  aliases: ['HRR', 'HRRs', 'holographic reduced representations']
  definition: >-
    A way to store structured facts, like who did what to whom, in one
    fixed-length list of numbers, using [[binding|binding]] and
    [[superposition|superposition]].
  notes:
    - >-
      Tony Plate introduced them in 1991 and gave the full account in a
      1995 journal paper. "Holographic" because, as in a
      hologram, every number carries a little of everything stored, so damage
      blurs the whole rather than erasing a part.

vector-symbolic-architecture:
  term: Vector-Symbolic Architecture
  aliases: ['VSA', 'VSAs', 'vector symbolic architectures', 'hyperdimensional computing']
  definition: >-
    The family of methods that compute with symbols as long random vectors,
    [[holographic-reduced-representation|HRRs]] among them.
  notes:
    - >-
      Members differ mainly in the numbers they use (real, complex, binary)
      and in how they bind. Pentti Kanerva's name for the field,
      hyperdimensional computing, is the other one you'll see.

binding:
  term: Binding
  aliases: ['bind', 'binds', 'bound']
  definition: >-
    Combining two vectors into a third that resembles neither, so a role and
    its filler ("agent" and "dog") become one pair.
  notes:
    - >-
      In an HRR, binding is [[circular-convolution|circular convolution]]. The
      pair is the same length as its parts, so pairs can be bound again to build
      nested structure.

superposition:
  term: Superposition
  aliases: ['superposed', 'bundling', 'bundle']
  definition: >-
    Adding vectors together into one that stays similar to each of them, so a
    single vector can hold a whole set.

circular-convolution:
  term: Circular Convolution
  aliases: ['convolution']
  definition: >-
    Mixing two lists of numbers by summing products along wrapped-around
    diagonals, giving a list of the same length.
  notes:
    - >-
      Done directly, it costs n² multiplications for vectors of length n. With a
      [[fft|fast Fourier transform]] it costs about n log n, which is why HRRs
      stay cheap at thousands of numbers.

unbinding:
  term: Unbinding
  aliases: ['unbind', 'unbinds', 'circular correlation']
  definition: >-
    Undoing a [[binding|binding]] to get a noisy copy of one part back, given
    the other part as the cue.
  notes:
    - >-
      In an HRR, it's circular correlation, an approximate inverse of
      [[circular-convolution|circular convolution]]. The copy comes back blurred
      by everything else in the vector, so a [[cleanup-memory|clean-up memory]]
      has to recognise it.

cleanup-memory:
  term: Clean-up Memory
  aliases: ['clean-up memories', 'cleanup memory']
  definition: >-
    A list of the known vectors that turns a noisy answer into the closest real
    one, usually by [[cosine-similarity|cosine similarity]].

fft:
  term: Fast Fourier Transform
  aliases: ['FFT', 'fast Fourier transforms']
  definition: >-
    A fast way to rewrite a list of numbers as the waves that add up to it,
    where [[circular-convolution|convolution]] becomes plain multiplication.
  notes:
    - >-
      It gets the same answer as the direct sum, give or take rounding, in
      about N · log₂ N steps instead of N², by reusing shared pieces rather
      than skipping any.

neuro-symbolic:
  term: Neuro-Symbolic
  aliases: ['neuro-symbolic AI']
  definition: >-
    Combining a learned [[neural-network|neural network]] with explicit symbols
    and rules, to get learning from data and reasoning you can inspect.

# ── Linear algebra ───────────────────────────────────────────────────

vector:
  term: Vector
  aliases: ['vectors']
  definition: >-
    An arrow with a length and a direction, written down as a list of numbers
    once you've picked a [[basis|basis]].

basis-vector:
  term: Basis Vector
  aliases: ['basis vectors']
  definition: >-
    One of the reference arrows a [[basis|basis]] is made of; every other
    [[vector|vector]] is described as some amount of each.

coordinates:
  term: Coordinates
  aliases: ['coordinate']
  definition: >-
    The amounts of each [[basis-vector|basis vector]] it takes to build a
    [[vector|vector]]: "three east, four north" is (3, 4).
  notes:
    - >-
      Change the basis and the coordinates change, even though the vector
      itself doesn't move.

linear-combination:
  term: Linear Combination
  aliases: ['linear combinations']
  definition: >-
    A sum of [[vector|vectors]], each multiplied by a number first: 3 × east
    + 4 × north.

standard-basis:
  term: Standard Basis
  definition: >-
    The default [[basis|basis]]: arrows of length 1 along each axis, like
    east and north on a map.

basis:
  term: Basis
  aliases: ['bases']
  definition: >-
    A set of reference arrows that can reach every point in a space, with no
    arrow redundant, so every point has exactly one set of
    [[coordinates|coordinates]].
  notes:
    - >-
      Formally: the arrows span the space and are
      [[linear-independence|linearly independent]]. A space has infinitely many
      bases, and they all have the same number of arrows, its
      [[dimension|dimension]].

linear-independence:
  term: Linear Independence
  aliases: ['linearly independent']
  definition: >-
    When no [[vector|vector]] in a set can be built from the others, so none
    of them is redundant.

dimension:
  term: Dimension
  aliases: ['dimensions']
  definition: >-
    The number of arrows in any [[basis|basis]] of a space: how many numbers
    it takes to say where a point is.

change-of-basis:
  term: Change of Basis
  definition: >-
    Describing the same [[vector|vectors]] with a different
    [[basis|basis]]: new [[coordinates|coordinates]], same points, same number
    of numbers.

diagonal-matrix:
  term: Diagonal Matrix
  aliases: ['diagonal']
  definition: >-
    A [[matrix|matrix]] that is zero everywhere off the line from top left
    to bottom right, so it just scales each [[basis-vector|basis vector]] by
    its own number.

matrix:
  term: Matrix
  aliases: ['matrices']
  definition: >-
    A grid of numbers. Multiplying a [[vector|vector]] by one gives a new
    vector, so a matrix can describe a transformation or a conversion between
    two [[basis|bases]].

inverse-matrix:
  term: Inverse Matrix
  aliases: ['inverse']
  definition: >-
    The [[matrix|matrix]] that undoes another one: multiply by both and you're
    back where you started.
  notes:
    - Only exists for a square matrix that doesn't squash any direction flat.

change-of-basis-matrix:
  term: Change-of-Basis Matrix
  definition: >-
    The [[matrix|matrix]] whose columns are the new
    [[basis-vector|basis vectors]] written in the old
    [[coordinates|coordinates]]; it turns new coordinates into old ones.
  notes:
    - Its [[inverse-matrix|inverse]] goes the other way, old into new.

linear-transformation:
  term: Linear Transformation
  aliases: ['linear transformations']
  definition: >-
    A way of moving every point in a space that keeps grid lines straight,
    parallel and evenly spaced, with the origin fixed. Once you pick a
    [[basis|basis]], every one can be written as a [[matrix|matrix]].

eigenvector:
  term: Eigenvector
  aliases: ['eigenvectors']
  definition: >-
    A direction that a [[linear-transformation|linear transformation]] keeps
    on its own line, only stretching, shrinking or flipping it.
  notes:
    - >-
      In a [[basis|basis]] made of eigenvectors (when one exists), the
      transformation's matrix is diagonal, which makes it far easier to work
      with.

discrete-cosine-transform:
  term: Discrete Cosine Transform (DCT)
  aliases: ['DCT']
  definition: >-
    Rewriting a block of numbers, like pixel values, as weights on a fixed set
    of cosine wave patterns, from smooth to busy.
  notes:
    - >-
      JPEG uses it on 8 × 8 blocks: 64 pixels in, 64 weights out. It's a
      [[change-of-basis|change of basis]]; the savings come from rounding the
      weights afterwards, which turns most of them into zeros that store
      cheaply.

residual-stream:
  term: Residual Stream
  definition: >-
    The running list of numbers a [[transformer|transformer]] keeps for each
    token, which every layer reads from and adds to.

privileged-basis:
  term: Privileged Basis
  definition: >-
    When something about a network's design makes its individual coordinates
    meaningful, so features tend to line up with the axes.
  notes:
    - >-
      By design, the [[residual-stream|residual stream]] doesn't have one: rotate it, and
      rotate every matrix that touches it to match, and the model behaves the
      same.

# ── Integers and bits ────────────────────────────────────────────────

bit:
  term: Bit
  aliases: ['bits']
  definition: >-
    One binary digit, a 0 or a 1: the smallest piece of information a computer
    stores.

integer:
  term: Integer
  aliases: ['integers']
  definition: >-
    A whole number; in a computer, one stored in a fixed number of
    [[bit|bits]], usually 8, 16, 32 or 64.

unsigned-integer:
  term: Unsigned Integer
  aliases: ['unsigned integers', 'unsigned']
  definition: >-
    An [[integer|integer]] that is never negative: 32 bits hold 0 to
    4,294,967,295.

signed-integer:
  term: Signed Integer
  aliases: ['signed integers', 'signed']
  definition: >-
    An [[integer|integer]] that can be negative, almost always stored as
    [[twos-complement|two's complement]]: 32 bits hold −2,147,483,648 to
    2,147,483,647.

modular-arithmetic:
  term: Modular Arithmetic
  aliases: ['clock arithmetic']
  definition: >-
    Arithmetic on a clock, where numbers wrap back to zero once they reach a
    fixed size, the modulus.
  notes:
    - 9 + 5 on a 12-hour clock is 2.
    - >-
      [[unsigned-integer|Unsigned]] 32-bit arithmetic is modular arithmetic
      with a modulus of 2³² = 4,294,967,296.

twos-complement:
  term: Two's Complement
  definition: >-
    The usual way to store negative [[integer|integers]]: the top half of the
    wrap-around range is read as negative, so the same adding circuit works
    for both.
  notes:
    - One step back from 0 is the largest pattern, all 1s, and it means −1.

overflow:
  term: Overflow
  aliases: ['overflows', 'overflowed']
  definition: >-
    When a result is too big (or too small) for the [[integer|integer]]
    holding it.
  notes:
    - >-
      In wrap-around arithmetic the extra is simply dropped, which is a bug
      whenever nobody expected it.

xor:
  term: XOR
  definition: >-
    Exclusive or: comparing two numbers [[bit|bit]] by bit and writing 1
    where they differ.
  notes:
    - Doing it twice with the same number undoes it.

modular-inverse:
  term: Modular Inverse
  aliases: ['modular inverses']
  definition: >-
    On a wrap-around clock, the number that undoes multiplying by another: the
    pair multiply to 1.
  notes:
    - >-
      On the 32-bit clock only odd numbers have one. The inverse of 3 is
      2,863,311,531, because 3 × 2,863,311,531 wraps around to 1.

bit-shift:
  term: Bit Shift
  aliases: ['shift', 'shifts', 'shifted']
  definition: >-
    Sliding every [[bit|bit]] of a number left or right by some places; bits
    pushed off the end are lost.
  notes:
    - A one-place shift left is the same as multiplying by 2.

hash-function:
  term: Hash Function
  aliases: ['hash functions', 'hash']
  definition: >-
    A function that turns data into a fixed-size number; a good one scrambles
    it so that similar inputs get very different outputs.

compiler:
  term: Compiler
  aliases: ['compilers']
  definition: >-
    A program that translates code a person wrote into the instructions a
    processor runs.

register:
  term: Register
  aliases: ['registers']
  definition: >-
    A small, fast storage slot inside the processor that holds one number
    while it's being worked on.

# ── Compression ──────────────────────────────────────────────────────

lossless-compression:
  term: Lossless Compression
  aliases: ['lossless']
  definition: >-
    Making a file smaller in a way that gives back every [[bit|bit]] of the
    original when it's decoded.
  notes:
    - >-
      Lossy compression, like ordinary JPEG, throws away detail the eye is
      unlikely to miss, so the decoded file is close to the original but not
      the same.

entropy-coding:
  term: Entropy Coding
  aliases: ['entropy coder']
  definition: >-
    Writing each value with a code whose length depends on how common it is,
    so frequent values take few [[bit|bits]] and rare ones take more.

wavelet-transform:
  term: Wavelet Transform
  aliases: ['wavelet transforms']
  definition: >-
    Splitting a signal into a half-size smooth version plus the details needed
    to rebuild it, then splitting the smooth part again, level after level.

lifting-step:
  term: Lifting Step
  aliases: ['lifting steps', 'lifting']
  definition: >-
    Adding to one half of a set of numbers something worked out from the other
    half, which stays untouched, so subtracting the same thing undoes it.
  notes:
    - >-
      Because the untouched half is still there, the step can be undone
      exactly even when what was added got rounded. That's what makes lossless
      [[wavelet-transform|wavelet transforms]] possible.

discrete-fourier-transform:
  term: Discrete Fourier Transform
  aliases: ['DFT', 'Fourier transform']
  definition: >-
    Rewriting a list of N samples as N amounts of different frequencies, each
    one a weighted sum of every sample.

walsh-hadamard-transform:
  term: Walsh–Hadamard Transform
  aliases: ['Walsh transform', 'Hadamard transform']
  definition: >-
    A transform whose weights are only +1 and −1, so every output is a sum of
    all the inputs with some signs flipped.

butterfly:
  term: Butterfly
  aliases: ['butterflies']
  definition: >-
    The two-number step an [[fft|FFT]] is built from: from a and b, make a + b
    and a − b, after turning b by a [[twiddle-factor|twiddle factor]].
  notes:
    - >-
      Named for its drawing: two inputs, two outputs and two lines crossing
      between them. With no turn it's the size-2
      [[walsh-hadamard-transform|Walsh–Hadamard transform]].

twiddle-factor:
  term: Twiddle Factor
  aliases: ['twiddle factors']
  definition: >-
    A fixed rotation that a [[fft|fast Fourier transform]] applies to one
    input of a [[butterfly]] before adding and subtracting.

task-vector:
  term: Task Vector
  aliases: ['task vectors']
  definition: >-
    A fine-tuned model's [[weights|weights]] minus the weights it started
    from: how far each number moved to learn one task.
  notes:
    - >-
      Adding it to a model teaches the task, and subtracting it removes it,
      as long as the models share the same starting weights.

model-soup:
  term: Model Soup
  aliases: ['model soups', 'soup', 'soups']
  definition: >-
    One model made by averaging the [[weights|weights]] of several models
    fine-tuned from the same starting point.

hidden-unit:
  term: Hidden Unit
  aliases: ['hidden units']
  definition: >-
    One of the internal values a [[neural-network|neural network]] computes
    between its input and its output.

perplexity:
  term: Perplexity
  definition: >-
    How surprised a language model is by real text on average, where lower
    means it predicts the text better.

prefix-sum:
  term: Prefix Sum
  aliases: ['prefix sums', 'running total', 'running totals']
  definition: >-
    A list where each entry is the total of every value up to and including
    that position in another list.

texture-mapping:
  term: Texture Mapping
  aliases: ['texture-mapped']
  definition: >-
    Painting a flat image onto the surface of a 3D shape as it is drawn.

summed-area-table:
  term: Summed-Area Table
  aliases: ['summed-area tables', 'integral image']
  definition: >-
    A grid where each cell holds the total of every value above it and to its
    left, itself included, so any rectangle's total takes four lookups.

fenwick-tree:
  term: Fenwick Tree
  aliases: ['Fenwick trees', 'binary indexed tree']
  definition: >-
    An array of totals over power-of-two blocks, so reading a running total
    or changing one value touches only a few blocks, about 20 for a million.

checksum:
  term: Checksum
  aliases: ['checksums']
  definition: >-
    A short number worked out from a block of data, used to check whether two
    blocks are probably the same without comparing them byte by byte.

rolling-checksum:
  term: Rolling Checksum
  aliases: ['rolling checksums', 'rolling hash']
  definition: >-
    A [[checksum]] of a sliding window that can be updated in a few steps as
    the window moves one position, instead of being recomputed from scratch.

merkle-tree:
  term: Merkle Tree
  aliases: ['Merkle trees', 'hash tree', 'hash trees']
  definition: >-
    A tree whose leaves are [[hash-function|hashes]] of items and whose every
    other node is a hash of its children, so equal roots mean the contents are
    almost certainly equal.

parity-bit:
  term: Parity Bit
  aliases: ['parity bits', 'parity', 'parity check', 'parity checks']
  definition: >-
    One extra [[bit]] chosen so the number of 1s is even (or, by agreement,
    odd), so that any single flipped bit breaks the count.

crc:
  term: Cyclic Redundancy Check
  aliases: ['CRC', 'CRCs', 'cyclic redundancy checks']
  definition: >-
    A [[checksum]] made from the remainder of dividing the data, read as one
    long binary number, by a fixed number, which catches every short burst of
    errors.

hamming-code:
  term: Hamming Code
  aliases: ['Hamming codes']
  definition: >-
    Overlapping [[parity-bit|parity checks]] arranged so that the ones that
    fail add up to the position of a single flipped [[bit]].

hamming-distance:
  term: Hamming Distance
  aliases: ['Hamming distances']
  definition: >-
    The number of positions at which two strings of [[bit|bits]] differ.

hyperbolic-space:
  term: Hyperbolic Space
  aliases: ['hyperbolic plane', 'hyperbolic geometry']
  definition: >-
    A geometry with constant negative curvature, where the length of a circle
    grows exponentially with its radius instead of in proportion to it.

poincare-disk:
  term: Poincaré Disk
  aliases: ['Poincaré ball']
  definition: >-
    A map of the whole [[hyperbolic-space|hyperbolic plane]] inside a circle,
    with an almost even scale near the centre and stretched without limit
    towards the edge.
  notes:
    - >-
      The same map in more dimensions sits inside a ball and is called the
      Poincaré ball; Nickel and Kiela's embeddings live in it.

distortion:
  term: Distortion
  definition: >-
    How far the distances in an [[embedding|embedding]] are from the true
    distances between the things it stands for.

mean-average-precision:
  term: Mean Average Precision
  definition: >-
    A score from 0 to 1 for how well each item's nearest points in an
    [[embedding|embedding]] are its true neighbours, where 1 means they always
    come first.

baseline:
  term: Baseline
  aliases: ['baselines']
  definition: >-
    The existing method a new one is compared against, to show it does better.

resident-set-size:
  term: Resident Set Size
  definition: >-
    How much of a process's memory is in RAM at a given moment; Linux reports
    it as VmRSS.

mutation-testing:
  term: Mutation Testing
  aliases: ['mutation test', 'mutant', 'mutants']
  definition: >-
    Judging a set of tests by making small deliberate changes to the code and
    checking whether any test fails.
