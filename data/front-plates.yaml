# Which US jurisdictions require a front license plate on a passenger car.
# Drawn by layouts/shortcodes/plate-map.html on /projects/visorplate.
#
# SOURCE. VisorPlate's own state checker (src/data/state-requirements.ts in the
# VisorPlate repo), re-checked against state law and reporting in September 2026.
# The only disagreement between sources was stale lists still counting Ohio,
# Alaska or Utah — all three dropped the front plate, dated below.
#
# `dropped` is the date a state stopped requiring one. It is only set on states
# that did so while front-plate laws were VisorPlate's market, which is why the
# map can say the market was shrinking and point at exactly where.
#
# `col` / `row` place the state on the tile map: one square per state, laid out
# so neighbours stay roughly neighbours. Every state gets the same square, which
# is the point — Rhode Island's law counts as much as Texas's does.
#
# Counts ("28 states and D.C.") are derived from this file by the template.
# Never write one into prose.
verified: 2026-09
states:
  AK: { name: Alaska,         required: false, col: 0,  row: 0, dropped: 2022-08-22 }
  ME: { name: Maine,          required: true,  col: 10, row: 0 }
  WI: { name: Wisconsin,      required: true,  col: 5,  row: 1 }
