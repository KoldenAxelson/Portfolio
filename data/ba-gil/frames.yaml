- id: "M_"
  name: "Correction: what's wrong (prefix)"
  family: "m"
  shape: CV
  kind: grid
  note: "Minor to worst. The enhancement row below is its mirror image."
  slots:
    a: { word: "Ma", gloss: "slightly wrong" }
    e: { word: "Me", gloss: "moderately wrong" }
    i: { word: "Mi", gloss: "badly wrong" }
    o: { word: "Mo", gloss: "very badly wrong" }
    u: { word: "Mu", gloss: "as wrong as it gets" }

- id: "_M"
  name: "Enhancement: what's better (suffix)"
  family: "m"
  shape: VC
  kind: grid
  note: "Minor to maximum: the correction prefixes flipped around, so better is literally the mirror of wrong."
  slots:
    a: { word: "Am", gloss: "slightly better" }
    e: { word: "Em", gloss: "moderately better" }
    i: { word: "Im", gloss: "much better" }
    o: { word: "Om", gloss: "far better" }
    u: { word: "Um", gloss: "as good as it gets" }
