# Frames: a fixed shape where only the vowel moves, and the vowel picks the
# meaning in the alphabet's own order (a e i o u ü). `slots` is keyed by that
# vowel; a missing vowel is an empty cell on the page, which is the point —
# the gaps are where the language grows next.
#
# kind: grid   one row of the frame table (shortcodes/ba-gil/frames.html)
#       ladder the body frame, where the alphabet position is the body
#              position; drawn top to bottom instead of as a row
# shape: the morpheme shape the frame produces (CVC root, CV prefix, VC suffix)
# swatch: an optional colour the cell draws (the colour and brightness frames)
#
# Every word here is also in the decoder's lexicon (partials/func/ba-gil-lexicon.html
# merges this file with morphemes.yaml), so don't repeat a frame word there.

- id: "M_N"
  name: "Who"
  family: "m"
  shape: CVC
  kind: grid
  slots:
    a: { word: "Man", gloss: "I, me" }
    e: { word: "Men", gloss: "we, the tribe" }
    i: { word: "Min", gloss: "you" }
    o: { word: "Mon", gloss: "they, a person" }

- id: "M_X"
  name: "The body, top to bottom"
  family: "m"
  shape: CVC
  kind: ladder
  note: "Alphabet position is body position: letters early in the alphabet sit high on the body, letters late in it sit low."
  rungs:
    - { word: "Mab", gloss: "hair" }
    - { word: "Mob", gloss: "head" }
    - { word: "Meb", gloss: "eyes" }
    - { word: "Mot", gloss: "legs" }
    - { word: "Müt", gloss: "toes" }

- id: "K_L"
  name: "Colour, in wavelength order"
  family: "k"
  shape: CVC
  kind: grid
  slots:
    a: { word: "Kal", gloss: "red",    swatch: "#d83a34" }
    e: { word: "Kel", gloss: "orange", swatch: "#e8822a" }
    i: { word: "Kil", gloss: "yellow", swatch: "#e9c62e" }
    o: { word: "Kol", gloss: "green",  swatch: "#3f9b4b" }
    u: { word: "Kul", gloss: "blue",   swatch: "#2f6fd1" }
    ü: { word: "Kül", gloss: "violet", swatch: "#7b4bc4" }

