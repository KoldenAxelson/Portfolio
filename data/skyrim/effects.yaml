# The 59 alchemy effects: which side of the mortar they fall on, their base
# strength, and every ingredient that deviates from it.
#
#   kind     "good" = a potion effect, "bad" = a poison effect. The builder's
#            first screen filters on this.
#   baseMag  base magnitude. 0 means the effect has no magnitude and its
#            strength lives entirely in the duration (Paralysis, Invisibility,
#            Waterbreathing, Light, Night Eye).
#   baseDur  base duration in seconds. 0 = instantaneous.
#   baseCost base gold cost, the multiplier behind a potion's sale value.
#   mult     ingredients whose magnitude or duration deviates from the base,
#            highest first. Anything not listed here is exactly 1.0.
#
# THE MULTIPLIERS ARE WHY CREATION CLUB INGREDIENTS ARE SILLY. Salmon Roe is
# x12.5 magnitude on Fortify Magicka; Watcher's Eye is x5 on Fortify Illusion;
# Screaming Maw is x4 on Regenerate Health; River Betty is x2.5 on Damage
# Health. Those are the numbers behind the builder's "most potent" ranking.
#
# CAVEAT worth knowing: when two DEVIATING ingredients share an effect, the game
# uses only the higher-priority one, and UESP believes priority is that
# ingredient's cost for the effect rather than its magnitude — so the stronger
# multiplier does not always win. The builder shows the best multiplier present,
# which is right whenever at most one deviating ingredient carries the effect
# (nearly always) and optimistic in the rare case where two do.
#
# Source: UESP effect pages, cross-checked against Skyrim:Alchemy Effects.
# Jarrin Root (x100 Damage Health) is deliberately absent — it is the
# Emperor's-assassination quest item and cannot be gathered.

