# Skyrim potion recipes — the whole potions section of /misc/skyrim/ lives here.
#
# One flat list, rendered by a single {{< potions >}} call in
# content/misc/skyrim.md. Cards appear in the order written below, so reorder by
# moving entries.
#
# ── Fields ───────────────────────────────────────────────────────────────────
#   title        (required) the name on the card.
#   ingredients  (required) 2 or 3 slugs from data/skyrim/ingredients.yaml.
#   description  (optional) markdown. Renders inside the collapsible note.
#   tag          (optional) one accent chip shown before the effect chips —
#                for a purpose the effect list does not state ("Money").
#   effects      (optional) OVERRIDE. Leave it out and the card computes the
#                real effects from the ingredients: an effect appears when two
#                or more of the ingredients share it. Only set this by hand if
#                the computed list is wrong, and say why when you do.
#   variants     (optional) list of {label, ingredients} — alternate ingredient
#                sets for the same idea, drawn inside the collapsible note with
#                their own computed effects.
#   value        (optional) rough gold each, free text.
#
# A slug that is not in ingredients.yaml raises a build warning and draws as a
# placeholder tile, so a typo is loud but never breaks the page.

- title: "Excaliboost"
  ingredients: [canis-root, hanging-moss, elves-ear]
  description: |
    Due to a glitch, Fortify Marksman works on all weapons — effectively doubling
    this potion's potency. As brewed it handles most of the game.

    Also, Juniper Berries are found everywhere near Markarth and are a solid option
    to replace Elves Ears which is often in short supply. Bear Claws can replace
    Hanging Moss in a pinch and show up a decent amount when walking. As long as you
    get the Canis Root to bind the ingredients, which can be found on Ivar's Path.

    If you're trying to push limits you can make two SEPARATE potions using Corkbulb
    Root with a Marksman ingredient and Stoneflower Petal with a One-Hand ingredient
    to get some boosted effect. Although the base potion is plenty powerful enough
    for most legendary encounters.

- title: "Nord Blood"
  ingredients: [fly-amanita, mora-tapinella, dragons-tongue]
  description: |
    The ideal Nord Power potion. Boosting that fear effect for higher levels
    comes in handy more often than not. Fire traps and dragons also handled.

    Note the fourth chip: Fly Amanita and Mora Tapinella both carry Regenerate
    Stamina, so this brews as a four-effect potion rather than three.

- title: "Elebane"
  ingredients: [hawk-beak, snowberries, dragons-tongue]
  description: |
    Kyne's Peace Shout v2 will just have Hawks fall from the sky. Dupe them
    though — they're a pain.

- title: "Liquid Gold"
  tag: "Money"
  ingredients: [salmon-roe, garlic, nordic-barnacle]
  description: |
    Takes 250 with boosts to get to 100. Guardian Stones and Dragonsreach will
    have what you need.
