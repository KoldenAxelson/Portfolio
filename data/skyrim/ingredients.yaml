# Every Skyrim alchemy ingredient — the table the potion builder runs on.
#
# 183 ingredients: base game, Dawnguard, Hearthfire, Dragonborn and Creation
# Club. Sourced from UESP's Skyrim:Ingredients table, with every row
# cross-checked against that ingredient's own page. Two invariants hold and are
# worth re-running if you edit this file: every ingredient has exactly four
# distinct effects, and every effect is carried by at least two ingredients
# (an effect on only one ingredient could never appear in a potion).
#
#   name    display name, exact UESP spelling
#   value   gold, used as the "most valuable" ranking on the builder's results
#   dlc     "" | DG (Dawnguard) | HF (Hearthfire) | DB (Dragonborn) | CC (Creation Club)
#   avail   1-5, how easily you get it:
#             5  super abundant — mountain flowers, lavender, cave mushrooms
#             4  abundant in certain areas, if you know where to look
#             3  around; you get one occasionally without planning for it
#             2  rare. A deliberate trip, or a lucky drop off something nasty
#             1  one spot, or a Creation Club Khajiit-caravan random roll
#           THIS IS JUDGEMENT, not game data — assigned by hand, ingredient by
#           ingredient. Edit freely; the builder's "easiest to gather" ranking
#           sums it, and the dots on each result card show it.
#   effects all four, IN GAME ORDER
#
# Slugs are also the image filenames — see assets/skyrim/ingredients/README.md.

