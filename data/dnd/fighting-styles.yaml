# ---------------------------------------------------------------------------
# Fighting Styles for the Revised Fighter. One at 1st level; Battle Tested
# (Warlord, 7th) grants a second.
#
# Two of these hand out maneuvers, which makes them the only place outside the
# Warlord's Combat Superiority where a maneuver can enter a character. `grants`
# records how many, so the picker can say so.
# ---------------------------------------------------------------------------

styles:
  - name: Archery
    text: >-
      You gain a bonus to attack rolls you make with ranged weapons equal to half
      your proficiency bonus rounded up.

  - name: Defense
    text: >-
      While you are wearing armor, you gain a bonus to AC equal to half your
      proficiency bonus rounded up.

  - name: Dueling
    text: >-
      When you are wielding a melee weapon in one hand and no other weapons, you
      gain your proficiency bonus to damage rolls with that weapon.

  - name: Great Weapon Fighting
    text: >-
      When you roll a 1 or 2 on a damage die for an attack you make with a melee
      weapon that you are wielding with two hands, you can reroll the die and must
      use the new roll, even if the new roll is a 1 or a 2. The weapon must have the
      two-handed or versatile property for you to gain this benefit.

  - name: Protection
    text: >-
      When a creature you can see attacks a target other than you that is within 5
      feet of you, you can use your reaction to impose disadvantage on all attack
      rolls against allies within 5 feet of you until the start of your next turn.
      You must be wielding a shield.

  - name: Two-Weapon Fighting
    text: >-
      When you deal damage with an off-hand weapon attack, you can add your ability
      modifier to the damage of the off-hand attack.

  - name: Blind Fighting
    text: >-
      You have blindsight with a range of half your proficiency bonus rounded up ×
      10 feet. Within that range, you can effectively see anything that isn't behind
      total cover, even if you're blinded or in darkness. Moreover, you can see an
      invisible creature within that range, unless the creature successfully hides
      from you.

  - name: Signature Technique
    grants: 1
    text: >-
      You gain 1 maneuver of your choice. The maneuver learned in this way can be
      used once per turn without expending a Superiority Die. However, you do not
      add your Superiority Die roll to the maneuver.

  - name: Superior Technique
    grants: 2
    text: >-
      You gain 2 maneuvers of your choice, and 1 Superiority Die. See Combat
      Superiority for how these are used.

  - name: Thrown Weapon Fighting
    text: >-
      You can draw a weapon that has the thrown property as part of the attack you
      make with the weapon. In addition, when you hit with a ranged attack using a
      thrown weapon, you gain a bonus to the damage roll equal to your proficiency
      bonus.

  - name: Unarmed Fighting
    text: >-
      Your unarmed strikes can deal bludgeoning damage equal to 1d6 + your Strength
      modifier on a hit. If you aren't wielding any weapons or a shield when you
      make the attack roll the d6 becomes a d8. Your fists count as light melee
      weapons. At the start of each of your turns, you can deal 1d4 bludgeoning
      damage to one creature grappled by you.
