{{- /* The tick / cross / reset control. Shared by every widget that shows a
       verdict, so the three icons are drawn in exactly one place. */ -}}
<button type="button" class="pz-verdict" data-swap-action="reset"
        title="Reset" aria-label="Reset the board">
  <svg class="pz-dot" viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"
       stroke="currentColor" stroke-width="2.1">
    <circle cx="12" cy="12" r="10" />
  </svg>
  <svg class="pz-tick" viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"
       stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10" /><path d="M7.6 12.4l3 3 5.8-6.3" />
  </svg>
  <svg class="pz-cross" viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"
       stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10" /><path d="M8.6 8.6l6.8 6.8M15.4 8.6l-6.8 6.8" />
  </svg>
  <svg class="pz-reset" viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"
       stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10" />
    <path d="M15.6 13.2a3.9 3.9 0 1 1-1.1-3.6" />
    <path d="M15.9 6.6v3.5h-3.5" />
  </svg>
</button>
